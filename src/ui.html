<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HADRON</title>
<meta name="author" content="Apiano F. Morais, Job S. Furtado Neto e Ivan C. Jardim">
<meta name="description" content="HADRON: jogo de tabuleiro de física de partículas. Produza quarks, construa hádrons e núcleos atômicos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: jogo de tabuleiro de física de partículas, sério e vivo
   IDEA a placa fotográfica de uma câmara de bolhas (trilhas de partículas em espiral) ao lado do console de um detector
   PICTURE o tabuleiro hexagonal como corte do detector, peças dos jogadores nas intersecções, campos quânticos como fichas
   COLOUR fundo negro de câmara de bolhas; as cores dos quarks do GDD nos hexágonos; jogadores em branco, laranja, rosa e lima
   TYPE Space Grotesk para títulos e números + Inter para texto
   LAYOUT laptop: faixa de instrução, tabuleiro à esquerda, console do jogador à direita, placar e registro abaixo; celular: instrução fixa, tabuleiro, placar, console, registro */
:root{color-scheme:dark;--bg:#0a0d10;--plate:#0f1418;--panel:#141a1f;--panel2:#1a2127;--line:#28323a;--ink:#edf1f3;--mute:#9babb4;--u:#7cc4ff;--d:#3d72e6;--c:#3ec27f;--s:#f2c94c;--t:#ef5350;--b:#a979ec;--e:#f0a830;--hot:#ff6b5b;--focus:#9fd8ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.42}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto auto 1fr auto;grid-template-areas:"top top" "banner banner" "board panel" "side panel" "foot panel";gap:14px 18px;max-width:1440px;margin:0 auto;padding:10px max(16px,2vw) 40px}
.top{grid-area:top;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1}
.top h1 small{font:500 14px Inter,sans-serif;color:var(--mute);margin-left:10px;letter-spacing:0}
.top .sp{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:hover:not(:disabled){border-color:#4a5862;background:#212a31}
.btn.pri{background:var(--ink);color:#0a0d10;border-color:var(--ink)}
.btn.pri:hover:not(:disabled){background:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.banner{grid-area:banner;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:68px}
.banner .who{display:flex;align-items:center;gap:8px;font:700 17px "Space Grotesk",sans-serif}
.banner .msg{flex:1 1 260px;color:var(--ink)}
.banner .msg em{font-style:normal;color:var(--mute)}
.banner .opts{display:flex;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;vertical-align:-2px;width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #000;box-shadow:0 0 0 1px #ffffff33}
.dice{display:flex;gap:6px}
.dice svg{width:40px;height:40px}
.dice.roll svg{animation:tumble .5s ease-out both}
.dice.roll svg+svg{animation-delay:.07s}
@keyframes tumble{0%{transform:rotate(-35deg) scale(.6);opacity:.2}70%{transform:rotate(8deg) scale(1.06)}100%{transform:none}}
.boardcol{grid-area:board;display:flex;flex-direction:column;gap:10px}
.boardbox{scroll-margin-top:130px;position:relative;border-radius:18px;background:radial-gradient(120% 90% at 30% 20%,#141b20,#0b0f12 70%);border:1px solid var(--line);overflow:hidden}
.boardbox svg{display:block;width:100%;height:auto;max-height:calc(100svh - 150px);touch-action:manipulation}
.hit{cursor:pointer}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);padding:0 4px}
.legend b{color:var(--ink);font-weight:600}
.qd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--k);color:#0a0d10;font:italic 700 13px "Space Grotesk",sans-serif;vertical-align:-4px;margin-right:3px;flex:none}
.qd.e{font-style:normal}
.cost{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center;white-space:nowrap}
.panel{grid-area:panel;display:flex;flex-direction:column;gap:12px}
@media(min-width:981px){.panel{position:sticky;top:10px;align-self:start;max-height:calc(100svh - 20px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.me{display:flex;align-items:center;gap:10px}
.me h2{margin:0;flex:1;font-size:22px}
.me .vp{font:700 30px/1 "Space Grotesk",sans-serif}
.me .vp small{font-size:15px;color:var(--mute);font-weight:500}
.res{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.res .rc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 2px 4px;text-align:center;color:inherit;font:inherit;cursor:pointer}
.res .rc:hover{border-color:#4a5862}
.res .qd{width:24px;height:24px;font-size:15px;margin:0}
.res .n{display:block;font:700 19px/1.2 "Space Grotesk",sans-serif}
.res .lab{display:block;font-size:11px;color:var(--mute);white-space:nowrap}
.res .unst{border-color:#5a3b3b}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.sym{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px "Space Grotesk",sans-serif;background:var(--panel2);border:1px solid var(--line)}
.sym.t2{border-radius:9px}
.sym.t3{border-radius:4px;font-size:12px}
.brow .nm{font-weight:600}
.brow .nm small{color:var(--mute);font-weight:500}
.brow .why{display:block;font-size:12px;color:var(--mute)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{min-height:40px;min-width:44px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;gap:2px}
.seg button[aria-pressed=true]{border-color:var(--ink);background:#2a343c}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.trow span.l{font-size:13px;color:var(--mute);width:62px}
.hand{display:grid;gap:8px}
.ic{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.ic.basic{border-color:#2f4b66}.ic.protect{border-color:#365c45}.ic.reaction{border-color:#614a2b}
.ic .hd{display:flex;align-items:baseline;gap:8px}
.ic .hd b{flex:1}
.ic .g{font-size:12px;color:var(--mute)}
.ic p{margin:4px 0 8px;font-size:13px;color:#c9d3d8}
.ic .why{font-size:12px;color:var(--mute)}
.side{grid-area:side;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl.cur .pn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pl .pn{font-weight:700}
.pl .tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:500}
.pl .pv{font:700 26px/1 "Space Grotesk",sans-serif;text-align:right}
.pl .st{grid-column:2/4;font-size:13px;color:var(--mute)}
.badges{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:12px;border-radius:6px;padding:1px 7px;background:#232c33;color:#dfe7eb}
.log{max-height:340px;overflow:auto;font-size:13px;margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-top:1px solid #1f282e;display:flex;gap:8px}
.log li .t{color:var(--mute);font-variant-numeric:tabular-nums;width:2.2em;flex:none;text-align:right}
.log li .dot{width:10px;height:10px;margin-top:4px;border-width:1px}
.ov{position:fixed;inset:0;background:#05070acc;display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{width:min(640px,100%);max-height:calc(100svh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal.wide{width:min(900px,100%)}
.modal h2{margin:0 0 6px;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.modal h3{font-size:17px;margin:20px 0 8px}
.modal p{margin:6px 0;color:#d4dde1}
.modal .lead{color:var(--mute);margin-bottom:14px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0}
.prow input{min-height:44px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;width:100%}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:#0a0d10}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--k);min-width:2px}
.hist{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;margin-top:8px}
.hist>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.hist b{color:var(--ink)}
.hb{position:relative;height:120px;width:100%;border-bottom:1px solid var(--line)}
.hb i{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 0 0;background:#5d6b74}
.hb i.f{background:var(--hot)}
.hb s{position:absolute;left:-3px;right:-3px;border-top:2px dashed #e8eef1cc;height:0}
ol.interp{padding-left:20px;margin:6px 0}
ol.interp li{margin:6px 0;color:#d4dde1}
.step{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;flex:none}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.tgrid>div{display:flex;align-items:center;gap:6px;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.tgrid>div>span:first-child{white-space:nowrap}
.foot{grid-area:foot;border-top:1px solid var(--line);padding-top:16px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:16px}
.foot img{height:72px;width:auto;flex:none}
.mhead{display:flex;align-items:flex-start;gap:16px;justify-content:space-between}
.mhead img{height:88px;width:auto;flex:none;margin:-4px -2px 0 0}
@media(max-width:640px){.mhead img{height:64px}.foot img{height:60px}}
.foot b{color:var(--ink);font-weight:600}
.phb{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid #34505f;background:transparent;color:#9fd8ff;font-size:12px;font-weight:600;margin-left:6px;vertical-align:1px}
.phb:hover{background:#16242c}
svg [data-phys]{cursor:pointer}
.legend button{background:none;border:0;color:inherit;font:inherit;padding:4px 2px;min-height:32px;cursor:pointer;border-radius:6px}
.legend button:hover b{text-decoration:underline}
.pnb{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline dotted #6c7d87;text-underline-offset:4px}
.banner.coach{border-color:#7a5a1e;background:linear-gradient(180deg,#1d1a12,var(--panel))}
.coach .stepno{font:600 13px Inter,sans-serif;color:var(--e)}
.coach .msg{flex:1 1 380px}
.prow select{min-height:44px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;width:100%}
.pbio{margin:-2px 0 8px 32px;font-size:13px;color:var(--mute)}
.pbio b{color:var(--ink);font-weight:600}
.phys .cat{display:block;color:var(--e);font-size:13px;font-weight:600;margin-bottom:4px}
.phys .sum{font-size:17px;line-height:1.55;color:var(--ink)}
.phys .deep{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.chip:hover{border-color:#4a5862}
.pent{border-top:1px solid var(--line);padding:12px 0}
.pent h4{margin:0 0 4px;font:600 16px "Space Grotesk",Inter,sans-serif}
.pent p{margin:4px 0}
details summary{cursor:pointer;color:#9fd8ff;font-weight:600;padding:6px 0;min-height:32px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#ffe3dc;color:#2a0c08;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 30px #0008}
@media(max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "banner" "board" "panel" "side" "foot"}
  .banner{position:sticky;top:0;z-index:6;box-shadow:0 8px 24px #000a}
  .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
  .boardbox svg{max-height:none}
  .banner.coach{position:static;box-shadow:none}
}
@media(max-width:640px){
  .side{grid-template-columns:minmax(0,1fr)}
  .res{grid-template-columns:repeat(4,minmax(0,1fr))}
  .banner{padding:8px 10px;gap:8px}
  .banner .msg{flex-basis:100%;order:3;font-size:14px}
  .top h1 small,.top .long{display:none}
  .modal{padding:16px}
  .modal h2{font-size:24px}
  .coach .msg{order:0;flex-basis:100%}
  .coach .dice{display:none}
}
@media(prefers-reduced-motion:reduce){.dice.roll svg,.pulse{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>HADRON <small id="sub">Física de partículas em 2d6</small></h1>
    <div class="sp"></div>
    <button class="btn ghost sm" id="bTut" type="button">Tutorial</button>
    <button class="btn ghost sm" id="bRules" type="button">Regras<span class="long"> e física</span></button>
    <button class="btn sm" id="bNew" type="button">Nova partida</button>
  </header>
  <section class="banner" id="banner" aria-live="polite"></section>
  <section class="boardcol">
    <div class="boardbox" id="board"></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="panel" id="panel"></aside>
  <section class="side">
    <div class="card"><h2>Placar</h2><div id="players"></div></div>
    <div class="card"><h2>Registro</h2><ul class="log" id="log"></ul></div>
  </section>
  <footer class="foot"><img src="{{LOGO}}" alt="LFCA | URCA" width="63" height="72"><div><b>Desenvolvido pelo LFCA</b>, Laboratório de Física Computacional Aplicada da Universidade Regional do Cariri (URCA).<br>HADRON foi criado por Apiano F. Morais, Job S. Furtado Neto e Ivan C. Jardim.</div></footer>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script>
/*ENGINE*/
</script>
<script>
/*PHYSICS*/
</script>
<script>
{
const E = HadronEngine;
const PCOL = ['#ffffff', '#ff8c3a', '#ff5ca8', '#c8f04a'];
const QHEX = { u: '#7cc4ff', d: '#3d72e6', c: '#3ec27f', s: '#f2c94c', t: '#ef5350', b: '#a979ec', e: '#f0a830' };
const QLET = { u: 'u', d: 'd', c: 'c', s: 's', t: 't', b: 'b', e: 'E' };
const GROUP = { basic: 'Básica', protect: 'Proteção', reaction: 'Reação', point: 'Ponto' };
const DEFAULT_NAMES = ['Apiano', 'Ivan', 'Job', 'César']; // César Lattes, codescobridor do píon
const SAVE_KEY = 'hadron.save.v1';
const LOGO = '{{LOGO}}';
const S = 50;
const PHYS = HADRON_PHYS;
const PERSONAS = [
  { id: 'marie', name: 'Marie', level: 1, phys: 'sci_marie' },
  { id: 'enrico', name: 'Enrico', level: 1, phys: 'sci_enrico' },
  { id: 'elisa', name: 'Elisa', level: 1, phys: 'sci_elisa' },
  { id: 'lise', name: 'Lise', level: 2, phys: 'sci_lise' },
  { id: 'mario', name: 'Mário', level: 2, phys: 'sci_mario' },
  { id: 'maria', name: 'Maria', level: 2, phys: 'sci_maria' },
  { id: 'wu', name: 'Chien-Shiung', level: 3, phys: 'sci_wu' },
  { id: 'murray', name: 'Murray', level: 3, phys: 'sci_murray' },
  { id: 'emmy', name: 'Emmy', level: 3, phys: 'sci_emmy' },
];
const PERSONA = id => PERSONAS.find(x => x.id === id);
const LEVEL = { 1: 'Fácil', 2: 'Médio', 3: 'Difícil' };
const SEAT_PERSONA = ['lise', 'mario', 'elisa', 'emmy'];
const PH_TILE = { u: 'q_u', d: 'q_d', c: 'q_c', s: 'q_s', t: 'q_t', b: 'q_b', higgs: 'higgs', decay: 'force_weak', fusion: 'force_strong' };
const PH_TOKEN = { higgs: 'higgs', decay: 'force_weak', fusion: 'force_strong' };
const PH_CARD = { forte: 'force_strong', fraca: 'force_weak', em: 'force_em', gravidade: 'force_grav', gauge: 'gauge', blindagem: 'shield', estab: 'stab', unificada: 'unif', fusao: 'nuc_fusion', fissao: 'nuc_fission', aniquilacao: 'annihilation', descoberta: 'discovery', colaboracao: 'collab', nobel: 'nobel', nature: 'nobel' };
const PH_PENDING = { higgsHex: 'higgs', higgsSteal: 'higgs', decayPick: 'force_weak', fusionPick1: 'force_strong', fusionPick2: 'force_strong' };
const PH_RES = k => k === 'e' ? 'energia' : 'q_' + k;

let st = null;
const ui = { mode: null, modal: null, rulesTab: 'regras', bankGive: null, bankGet: null, trade: null, lastDice: '', overShown: false, setup: null, toastT: 0, physKey: null, physDeep: false, physStack: [], physReturn: null };
let botTimer = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = p => (p * 100).toFixed(1).replace('.', ',') + '%';
const qd = k => `<i class="qd${k === 'e' ? ' e' : ''}" style="--k:${QHEX[k]}">${QLET[k]}</i>`;
const costHTML = c => `<span class="cost">${Object.entries(c).filter(([, n]) => n > 0).map(([k, n]) => `<span>${qd(k)}${n}</span>`).join('')}</span>`;
const pdot = i => `<span class="dot" style="background:${esc(st.players[i].color)}"></span>`;
const pname = i => `${pdot(i)}<span>${esc(st.players[i].name)}</span>`;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const phb = (key, label = 'física') => PHYS.e[key] ? `<button class="phb" type="button" data-phys="${key}" aria-label="A física: ${esc(PHYS.e[key].t)}">${label}</button>` : '';
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v * t + B[i] * (1 - t)).toString(16).padStart(2, '0')).join('');
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(ui.toastT); ui.toastT = setTimeout(() => { t.hidden = true; }, 2800);
}
function save() {

  }
  h += `<h3>Com outro jogador</h3><button class="btn sm" type="button" data-a="trade" ${canAct ? '' : 'disabled'}>Propor troca…</button></div>`;

  const uniq = [...new Set(p.cards)];
  h += `<div class="card"><h2>Cartas de Interação <small class="num" style="color:var(--mute);font-weight:500">${p.cards.length}/${E.HAND}</small></h2>`;

  h += '<div class="hand">' + (uniq.length ? uniq.map(id => {
    const C = E.CARDS[id], n = p.cards.filter(c => c === id).length;

  }).join('') : '<p class="note">Sem cartas na mão.</p>') + '</div>';
  if (p.points.length) h += `<h3>Conquistas</h3><p class="note">${p.points.map(c => esc(E.CARDS[c].name)).join(', ')} (+${p.points.length}) ${phb('nobel')}</p>`;
  h += '</div>';
  el.innerHTML = h;
}

// ------------------------------------------------------------ ciclo
function render() {
  if (!st) return;
  tutCheck();
  if (st.phase === 'over' && !ui.overShown && !st.demo) { ui.overShown = true; ui.modal = 'over'; renderModal(); }
  if (ui.mode && (st.pending || !humanTurn())) ui.mode = null;
  $('#sub').textContent = st.phase === 'setup' ? 'Preparação' : `Rodada ${Math.max(1, Math.ceil(st.turn / st.players.length))}`;
  renderBanner(); renderBoard(); renderPanel(); renderPlayers(); renderLog();
  scheduleBot(); tutSchedule();
}
function scheduleBot() {
  clearTimeout(botTimer);
  if (!st || st.phase === 'over' || tutActive() || !st.players[actor()].bot) return;
  if (st.demo && st.phase === 'over') return;
  botTimer = setTimeout(() => {
    if (!st || st.phase === 'over' || !st.players[actor()].bot) return;
    try { E.apply(st, E.botAction(st)); }
    catch (e) { try { E.apply(st, st.pending ? { type: 'pick', value: st.pending.options[0] } : { type: 'end' }); } catch (e2) { toast('O computador travou: ' + e2.message); return; } }
    save(); render();
  }, st.demo ? 700 : 650);
}
function startGame(players) {
  st = E.newGame({ players });
  ui.mode = null; ui.overShown = false; ui.bankGive = ui.bankGet = null; ui.lastDice = '';
  ui.modal = null; renderModal(); save(); render();
}
function demoGame(seed = 8128) {
  const g = E.newGame({ players: ['marie', 'lise', 'emmy'].map((id, i) => ({ name: PERSONA(id).name, color: PCOL[i], bot: true, level: PERSONA(id).level, persona: id })), seed });
  g.demo = true;
  let guard = 0;
  while (g.phase !== 'over' && g.turn < 26 && guard++ < 5000) E.apply(g, E.botAction(g));
  if (g.phase === 'over') return demoGame(seed + 1);
  return g;
}

// ------------------------------------------------------------ tutorial guiado
const TUT_SEED = 314159;
const tutActive = () => !!(st && st.tutorial && st.tutorial.active);
const tutStep = () => tutActive() ? TUT[st.tutorial.step] : null;
const ownCount = pi => Object.values(st.buildings).filter(b => b.owner === pi).length;
const roadCount = pi => Object.values(st.roads).filter(r => r.owner === pi).length;
const kindNames = v => [...new Set(st.board.vertices[v].hexes.map(h => st.board.hexes[h].kind).filter(E.isProd))].map(k => E.QN[k]);
const listPT = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
function bestVertex(opts) { let b = opts[0], bs = -1; for (const v of opts) { const sc = E.vertexScore(st, v); if (sc > bs) { bs = sc; b = v; } } return b; }
function bestEdge(edges) {
  let b = edges[0], bs = -1;
  for (const e of edges) {
    let sc = 0;
    for (const w of st.board.edges[e].v) if (E.distanceOK(st, w)) sc = Math.max(sc, E.vertexScore(st, w));
    if (sc > bs) { bs = sc; b = e; }
  }
  return b;
}
function diceFor(pi) {
  const nums = new Set();
  for (const [v, b] of Object.entries(st.buildings)) {
    if (b.owner !== pi) continue;
    for (const h of st.board.vertices[+v].hexes) { const H = st.board.hexes[h]; if (E.isProd(H.kind) && st.tokens.higgs !== h) nums.add(H.num); }
  }
  let best = 6, bp = -1;
  for (const n of nums) if (E.prob(n) > bp) { bp = E.prob(n); best = n; }
  const d1 = Math.min(6, best - 1);
  return [d1, best - d1];
}
function higgsTarget(opts) {
  let best = null, bs = -1;
  for (const h of opts) {
    const H = st.board.hexes[h];
    if (!E.isProd(H.kind)) continue;
    let mine = false, sc = 0;
    for (const v of H.verts) { const b = st.buildings[v]; if (!b) continue; if (b.owner === 0) mine = true; else if (E.qCount(st.players[b.owner]) > 0) sc += 1 + E.prob(H.num); }
    if (!mine && sc > bs) { bs = sc; best = h; }
  }
  if (best === null) best = opts.find(h => !st.board.hexes[h].verts.some(v => st.buildings[v] && st.buildings[v].owner === 0)) ?? opts[0];
  return best;
}
const TT = () => st.tutorial;
const TUT = [
  { expect: 'next', text: () => `Bem-vindo ao <b>HADRON</b>! Você dirige um laboratório de física. Os aceleradores do tabuleiro produzem quarks e, com eles, você monta hádrons e núcleos atômicos. Vence quem chegar primeiro a ${E.WIN} pontos de estabilidade.` },
  { expect: 'next', phys: 'abund', text: () => 'Cada hexágono colorido é um acelerador que produz um tipo de quark, indicado pela letra: <b>u</b>, <b>d</b>, <b>c</b>, <b>s</b>, <b>t</b> ou <b>b</b>. O número na ficha é a soma dos dois dados que ativa a produção; os pontinhos mostram a chance. Up e Down são os mais comuns, como na natureza; Top e Bottom são raríssimos.' },
  { expect: 'next', phys: 'higgs', text: () => 'Os três hexágonos escuros são <b>Campos Quânticos</b>. Quando os dados somam 2, 7 ou 12, em vez de produzir, um campo é ativado: Decaimento (2), Higgs (7) e Fusão (12). As fichas W±, H⁰ e g mostram onde cada campo está.' },
  { expect: 'pick', phys: 'proton', enter: () => { TT().target = bestVertex(st.pending.options); },
    text: () => `Posicione seu <b>Próton</b> no ponto destacado, sem custo. Ele toca hexágonos de ${listPT(kindNames(TT().target))}. As peças ficam nas intersecções e recebem o quark de cada hexágono em volta. Dois hádrons nunca ficam em intersecções vizinhas.`,
    done: () => ownCount(0) >= 1 },
  { expect: 'pick', phys: 'drift', enter: () => { TT().target = bestEdge(st.pending.options); },
    text: () => 'Agora ligue um <b>Tubo de Deriva</b> ao seu Próton, no trecho destacado. As conexões levam a novas intersecções onde você poderá construir, e 5 ou mais em sequência valem 2 pontos pela Maior Cadeia de Aceleradores.',
    done: () => roadCount(0) >= 1 },
  { expect: 'auto', text: () => 'Marie e Enrico, seus adversários no tutorial, posicionam as peças deles. A ordem vai e volta: quem colocou por último na primeira volta coloca primeiro na segunda.',
    done: () => !!st.pending && st.pending.who === 0 },
  { expect: 'pick', phys: 'neutron', enter: () => { TT().target = bestVertex(st.pending.options); },
    text: () => `Sua vez de novo: posicione seu <b>Nêutron</b> no ponto destacado. Os recursos iniciais vêm dos hexágonos em volta desta segunda peça, e este ponto toca ${listPT(kindNames(TT().target))}.`,
    done: () => ownCount(0) >= 2 },
  { expect: 'pick', phys: 'drift', enter: () => { TT().target = bestEdge(st.pending.options); },
    text: () => 'Ligue o segundo Tubo de Deriva. Com isso a preparação termina e você recebe seus recursos iniciais.',
    done: () => roadCount(0) >= 2 },
  { expect: 'roll', cta: 'Rolar dados', enter: () => { TT().dice = diceFor(0); },
    text: () => 'Hora de rolar os dados! No tutorial, os dados estão combinados para mostrar a produção funcionando.',
    done: () => st.phase === 'play' && st.rolled && st.current === 0 },
  { expect: 'next', phys: 'acc_linear', text: () => { const sm = st.dice ? st.dice[0] + st.dice[1] : 0; return `Saiu <b>${sm}</b>. Toda construção vizinha de um hexágono com ${sm} recebe o quark dele: hádrons recebem 1, núcleos recebem 2. Confira seus quarks no painel do jogador.`; } },
  { expect: 'next', phys: 'q_t', enter: () => { const p = st.players[0]; E.grant(st, 0, { u: Math.max(0, 1 - p.res.u), d: Math.max(0, 2 - p.res.d), t: 1 }); },
    text: () => 'Para acelerar o tutorial, o laboratório recebeu uma verba: agora você tem o necessário para um Deutério e ganhou 1 quark <b>Top</b>. Top e Bottom são instáveis: se não forem usados no turno, decaem em Charm ou Strange e liberam 1 Energia.' },
  { expect: 'build', kind: 'deuterium', cta: 'Construir Deutério', phys: 'deuterium',
    enter: () => { const f = Object.entries(st.buildings).find(([, b]) => b.owner === 0 && b.type === 'proton'); TT().target = f ? +f[0] : null; },
    skip: () => !Object.values(st.buildings).some(b => b.owner === 0 && b.type === 'proton'),
    text: () => 'Construa um <b>Deutério</b> sobre o seu Próton: toque no botão e depois no ponto destacado. Núcleos evoluem no mesmo lugar e você paga só o núcleon que falta: 1 Up + 2 Down, ou seja, um nêutron. O Deutério vale 2 pontos e produz 2 quarks.',
    done: () => !!st.buildings[TT().target] && st.buildings[TT().target].type === 'deuterium' },
  { expect: 'card', card: 'gravidade', cta: 'Jogar Gravidade', phys: 'force_grav', enter: () => { E.giveCard(st, 0, 'gravidade'); },
    text: () => 'Agora uma <b>Carta de Interação</b>. Você recebeu a Gravidade: ela atrai 1 quark de cada hexágono vizinho a uma construção sua. Jogue a carta e escolha o seu Deutério. Só dá para jogar uma carta por turno.',
    done: () => st.flags.cardPlayed && !st.pending },
  { expect: 'end', cta: 'Encerrar turno', phys: 'q_t',
    text: () => 'Encerre o turno. Repare no registro: o Top que você não usou vai decair em Charm + 1 Energia, como os quarks pesados de verdade, que vivem frações de segundo.',
    done: () => st.current !== 0 },
  { expect: 'auto', text: () => 'Marie e Enrico jogam os turnos deles.', done: () => st.current === 0 && !st.rolled && !st.pending },
  { expect: 'roll', cta: 'Rolar dados', phys: 'higgs', enter: () => { TT().dice = [3, 4]; },
    text: () => 'Role de novo. Desta vez o tutorial combinou um <b>7</b> para mostrar o Campo de Higgs.',
    done: () => st.rolled },
  { expect: 'pick', phys: 'higgs', enter: () => { TT().target = higgsTarget(st.pending.options); },
    skip: () => !(st.pending && st.pending.kind === 'higgsHex'),
    text: () => '<b>Campo de Higgs!</b> Mova a ficha H⁰ para o hexágono destacado. Enquanto ela estiver lá, ele não produz, e você rouba 1 quark aleatório de quem tem construção nele. Na natureza, o campo de Higgs dá massa às partículas; aqui ele "pesa" sobre um acelerador.',
    done: () => !st.pending || st.pending.kind !== 'higgsHex' },
  { expect: 'pick', any: true, skip: () => !(st.pending && st.pending.kind === 'higgsSteal'),
    text: () => 'Mais de um adversário tem construção nesse hexágono: escolha de quem roubar.', done: () => !st.pending },
  { expect: 'build', kind: 'drift', cta: 'Construir Tubo de Deriva', phys: 'chain',
    enter: () => { const p = st.players[0]; E.grant(st, 0, { c: Math.max(0, 1 - p.res.c), s: Math.max(0, 1 - p.res.s) }); const sp = E.buildSpots(st, 0, 'drift'); TT().target = sp.length ? bestEdge(sp) : null; TT().roads = roadCount(0); },
    skip: () => !E.buildSpots(st, 0, 'drift').length,
    text: () => 'Construa mais um Tubo de Deriva no trecho destacado; ele custa 1 Charm + 1 Strange. As conexões levam a intersecções livres, onde você pode construir novos hádrons: Próton, Nêutron, Lambda, Píon ou Káon.',
    done: () => roadCount(0) > TT().roads },
  { expect: 'next', phys: 'force_weak', text: () => 'O que falta saber: o Campo de <b>Decaimento</b> (2) rebaixa um núcleo de um adversário, e o de <b>Fusão</b> (12) obriga dois adversários a fundir quarks. Você pode trocar 4 quarks iguais por 1 com o banco, 3 Energias por 1 quark, ou negociar com outros jogadores. Três mésons, os quatro núcleos ou as quatro forças valem pontos extras.' },
  { expect: 'done', text: () => 'Pronto, você aprendeu o essencial! Continue esta partida contra Marie e Enrico, no nível fácil, ou comece uma nova. Para ler a física por trás de qualquer peça, toque nela no tabuleiro ou nos botões <b>física</b>.' },
];
function tutCheck() {
  let guard = 0;
  while (tutActive() && guard++ < 40) {
    const T = TT(), s = TUT[T.step];
    if (!s) { T.active = false; break; }
    if (!T.entered) {
      if (s.skip && s.skip()) { T.step++; continue; }
      if (s.enter) s.enter();
      T.entered = true;
    }
    if (s.done && s.done()) { T.step++; T.entered = false; continue; }
    break;
  }
}
function tutAllows(a) {
  const s = tutStep();
  if (!s) return true;
  const T = TT();
  switch (s.expect) {
    case 'pick': return a.type === 'pick' && (s.any || same(a.value, T.target));
    case 'roll': return a.type === 'roll';
    case 'build': return a.type === 'build' && a.kind === s.kind && a.at === T.target;
    case 'card': return (a.type === 'card' && a.id === s.card) || (a.type === 'pick' && !!st.pending && st.pending.kind === 'gravity');
    case 'end': return a.type === 'end';
    default: return false;
  }
}
let tutTimer = 0;
function tutSchedule() {
  clearTimeout(tutTimer);
  const s = tutStep();
  if (!s || s.expect !== 'auto') return;
  tutTimer = setTimeout(() => {
    if (tutStep() !== s) return;
    try {
      if (st.pending && st.pending.who !== 0) E.apply(st, E.botAction(st));
      else if (!st.pending && st.current !== 0) E.apply(st, st.rolled ? { type: 'end' } : { type: 'roll', dice: diceFor(st.current) });
    } catch (e) { toast(e.message); }
    render();
  }, 600);
}
function renderCoach(dice) {
  const s = tutStep(), T = TT(), pd = st.pending;
  let btns = '';
  if (s.expect === 'next') btns += '<button class="btn pri" type="button" data-tut="next">Próximo</button>';
  if (s.cta && !(s.expect === 'build' && ui.mode) && !(s.expect === 'card' && pd)) btns += `<button class="btn pri" type="button" data-tut="cta">${s.cta}</button>`;
  if (pd && pd.who === 0 && pd.pick === 'player' && s.expect === 'pick') btns += pd.options.map(i => `<button class="btn" type="button" data-pick="${i}">${pdot(i)} ${esc(st.players[i].name)}</button>`).join('');
  if (s.expect === 'done') btns += '<button class="btn pri" type="button" data-tut="continue">Continuar jogando</button><button class="btn" type="button" data-a="new">Nova partida</button>';
  if (s.phys) btns += `<button class="btn" type="button" data-phys="${s.phys}">A física</button>`;
  if (s.expect !== 'done') btns += '<button class="btn ghost" type="button" data-tut="exit">Sair do tutorial</button>';
  const boardPickNow = (s.expect === 'pick' && pd && pd.who === 0 && pd.pick !== 'player') || (s.expect === 'build' && ui.mode) || (s.expect === 'card' && pd && pd.who === 0);
  const hint = boardPickNow ? ' <em>Toque no ponto destacado do tabuleiro.</em>' : s.expect === 'auto' ? ' <em>Aguarde a jogada dos adversários…</em>' : '';
  const b = $('#banner');
  b.className = 'banner coach';
  b.innerHTML = `${dice}<div class="msg"><span class="stepno">Tutorial · passo ${T.step + 1} de ${TUT.length}</span><br>${s.text()}${hint}</div><div class="opts">${btns}</div>`;
}
function tutButton(kind) {
  if (!tutActive()) return;
  const s = tutStep(), T = TT();
  if (kind === 'next' && s.expect === 'next') { T.step++; T.entered = false; return render(); }
  if (kind === 'exit' || kind === 'continue') { T.active = false; ui.mode = null; save(); toast(kind === 'exit' ? 'Tutorial encerrado. A partida continua normalmente.' : 'Boa partida!'); return render(); }
  if (kind === 'cta') {
    if (s.expect === 'roll') return act({ type: 'roll' });
    if (s.expect === 'end') return act({ type: 'end' });
    if (s.expect === 'card') return act({ type: 'card', id: s.card });
    if (s.expect === 'build') { ui.mode = { kind: 'place', build: s.kind, spots: [T.target] }; render(); $('#board').scrollIntoView({ block: matchMedia('(max-width:980px)').matches ? 'start' : 'nearest', behavior: 'smooth' }); }
  }
}
function startTutorial() {
  const name = (ui.setup && ui.setup.players[0] && (ui.setup.players[0].name || '').trim()) || 'Você';
  st = E.newGame({ seed: TUT_SEED, players: [
    { name, color: PCOL[0] },
    { name: 'Marie', color: PCOL[1], bot: true, level: 1, persona: 'marie' },
    { name: 'Enrico', color: PCOL[2], bot: true, level: 1, persona: 'enrico' },
  ] });
  E.stripCard(st, 1, 'estab'); E.stripCard(st, 2, 'estab');
  st.tutorial = { active: true, step: 0, entered: false, target: null, dice: null, roads: 0 };
  ui.mode = null; ui.overShown = false; ui.bankGive = ui.bankGet = null; ui.lastDice = '';
  ui.modal = null; renderModal(); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ------------------------------------------------------------ eventos
function onClick(ev) {
  const t = ev.target.closest('[data-a],[data-pick],[data-build],[data-bg],[data-bt],[data-en],[data-li],[data-card],[data-pn],[data-ptype],[data-tab],[data-tr],[data-tto],[data-v],[data-e],[data-h],[data-phys],[data-physgo],[data-jump],[data-tut]');
  if (!t) return;
  const d = t.dataset;
  if (d.a === 'ovclose' && ev.target !== t) return;
  if (d.v !== undefined || d.e !== undefined || d.h !== undefined) return boardPick(d);
  if (d.tut) return tutButton(d.tut);
  if (d.physgo) return openPhys(d.physgo, true);
  if (d.jump) { const el = document.getElementById('ph-' + d.jump); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  if (d.phys) {
    if (t.closest('#board')) { const hl = highlights(); if (ui.mode || hl.v.size || hl.e.size || hl.h.size) return; }
    return openPhys(d.phys, false);
  }
  if (d.pick !== undefined) return act({ type: 'pick', value: JSON.parse(d.pick) });
  if (d.build) {
    const pi = st.current, p = st.players[pi];
    const ts = tutStep();
    const spots = ts && ts.expect === 'build' ? [st.tutorial.target] : E.buildSpots(st, pi, d.build).filter(at => E.payPlan(p, E.costOf(st, pi, d.build, at)).ok);
    ui.mode = { kind: 'place', build: d.build, spots };
    render();
    $('#board').scrollIntoView({ block: matchMedia('(max-width:980px)').matches ? 'start' : 'nearest', behavior: 'smooth' });
    return;
  }
  if (d.bg) { ui.bankGive = d.bg; return render(); }
  if (d.bt) { ui.bankGet = d.bt; return render(); }
  if (d.en) return act({ type: 'energy', get: d.en });
  if (d.li) return act({ type: 'li', get: d.li });
  if (d.card) return act({ type: 'card', id: d.card });
  if (d.pn) { ui.setup.n = +d.pn; return renderModal(); }
  if (d.ptype) {
    readNames();
    const [i, k] = d.ptype.split(':'), s = ui.setup, P = s.players[+i];
    P.bot = k === 'b';
    if (P.bot) {
      const taken = new Set(s.players.slice(0, s.n).filter((q, j) => j !== +i && q.bot).map(q => q.persona));
      if (!P.persona || taken.has(P.persona)) P.persona = (PERSONAS.find(x => !taken.has(x.id)) || PERSONAS[0]).id;
    }
    return renderModal();
  }
  if (d.tab) { ui.rulesTab = d.tab; return renderModal(); }
  if (d.tto) { ui.trade.to = +d.tto; ui.trade.get = {}; return renderModal(); }
  if (d.tr) {
    const [side, k, delta] = d.tr.split(':'), T = ui.trade;
    const src = side === 'give' ? st.players[st.current] : st.players[T.to];
    T[side][k] = Math.max(0, Math.min(src.res[k], (T[side][k] || 0) + +delta));
    return renderModal();
  }
  switch (d.a) {
    case 'roll': return act({ type: 'roll' });
    case 'end': return act({ type: 'end' });
    case 'cancel': ui.mode = null; return render();
    case 'bank': { const a = { type: 'bank', give: ui.bankGive, get: ui.bankGet }; ui.bankGive = ui.bankGet = null; return act(a); }
    case 'unify': return act({ type: 'unify' });
    case 'trade': ui.trade = { to: null, give: {}, get: {} }; return openModal('trade');
    case 'sendtrade': { const T = ui.trade; ui.modal = null; renderModal(); return act({ type: 'offer', to: T.to, give: T.give, get: T.get }); }
    case 'new': ui.setup = ui.setup || setupDefaults(); return openModal('new');
    case 'tutorial': readNames(); return startTutorial();
    case 'deep': ui.physDeep = true; return renderModal();
    case 'physback': ui.physKey = ui.physStack.pop(); ui.physDeep = false; return renderModal();
    case 'physall': ui.physReturn = null; ui.rulesTab = 'fisica'; return openModal('rules');
    case 'over': return openModal('over');
    case 'continue': { const g = loadSaved(); if (g) { st = g; ui.overShown = !!g.winner; ui.modal = null; renderModal(); render(); } return; }
    case 'start': {
      readNames();
      const s = ui.setup;
      const players = s.players.slice(0, s.n).map((p, i) => {
        const per = p.bot ? PERSONA(p.persona) || PERSONAS[3] : null;
        return per ? { name: per.name, color: PCOL[i], bot: true, level: per.level, persona: per.id } : { name: (p.name || '').trim() || DEFAULT_NAMES[i], color: PCOL[i], bot: false };
      });
      if (players.every(p => p.bot)) toast('Todos são computador: a partida vai rodar sozinha.');
      return startGame(players);
    }
    case 'close': case 'ovclose': return closeModal();
  }
}
function readNames() {
  if (!ui.setup) return;
  ui.setup.players.forEach((p, i) => { const el = document.getElementById(`p${i}name`); if (el) p.name = el.value; });
}
function boardPick(d) {
  if (!st || !humanTurn()) return;
  const v = d.v !== undefined ? +d.v : null, e = d.e !== undefined ? +d.e : null, h = d.h !== undefined ? +d.h : null;
  if (ui.mode && ui.mode.kind === 'place') return act({ type: 'build', kind: ui.mode.build, at: E.BUILD[ui.mode.build].tier === 3 ? e : v });
  const pd = st.pending;
  if (!pd) return;
  if (pd.pick === 'target') return act({ type: 'pick', value: v !== null ? { k: 'v', id: v } : { k: 'e', id: e } });

}
document.addEventListener('click', onClick);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (ui.modal) closeModal(); else if (ui.mode) { ui.mode = null; render(); }
});
document.addEventListener('input', ev => { if (ev.target.id && /^p\dname$/.test(ev.target.id)) readNames(); });
document.addEventListener('change', ev => { const seat = ev.target.dataset && ev.target.dataset.seat; if (seat !== undefined && ui.setup) { ui.setup.players[+seat].persona = ev.target.value; renderModal(); } });
$('#bTut').addEventListener('click', () => startTutorial());
$('#bRules').addEventListener('click', () => openModal('rules'));
$('#bNew').addEventListener('click', () => { ui.setup = ui.setup || setupDefaults(); openModal('new'); });

function start(data) {
  renderLegend();
  if (data && data.st && data.st.board && !data.st.demo) { st = data.st; ui.overShown = !!st.winner; render(); return; }
  const saved = loadSaved();
  if (saved && !saved.winner) { st = saved; render(); return; }
  st = demoGame();
  ui.setup = setupDefaults();
  render();
  openModal('new');
}
window.claude?.hot?.snapshot?.(() => ({ st }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
