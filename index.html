<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HADRON</title>
<meta name="author" content="Apiano F. Morais, Job S. Furtado Neto e Ivan C. Jardim">
<meta name="description" content="HADRON: jogo de tabuleiro de Física de partículas. Produza quarks, construa hádrons e núcleos atômicos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: jogo de tabuleiro de Física de partículas, sério e vivo
   IDEA a placa fotográfica de uma câmara de bolhas (trilhas de partículas em espiral) ao lado do console de um detector
   PICTURE o tabuleiro hexagonal como corte do detector, peças dos jogadores nas intersecções, campos quânticos como fichas
   COLOUR fundo negro de câmara de bolhas; as cores dos quarks do GDD nos hexágonos; jogadores em branco, laranja, rosa e lima
   TYPE Space Grotesk para títulos e números + Inter para texto
   LAYOUT laptop: faixa de instrução, tabuleiro à esquerda, console do jogador à direita, placar e registro abaixo; celular: instrução fixa, tabuleiro, placar, console, registro */
:root{color-scheme:dark;--bg:#0a0d10;--plate:#0f1418;--panel:#141a1f;--panel2:#1a2127;--line:#28323a;--ink:#edf1f3;--mute:#9babb4;--u:#7cc4ff;--d:#3d72e6;--c:#3ec27f;--s:#f2c94c;--t:#ef5350;--b:#a979ec;--e:#f0a830;--hot:#ff6b5b;--focus:#9fd8ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.42}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto auto 1fr auto;grid-template-areas:"top top" "banner banner" "board panel" "side panel" "foot panel";gap:14px 18px;max-width:1440px;margin:0 auto;padding:10px max(16px,2vw) 40px}
.top{grid-area:top;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1}
.top h1 small{font:500 14px Inter,sans-serif;color:var(--mute);margin-left:10px;letter-spacing:0}
.top .sp{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:hover:not(:disabled){border-color:#4a5862;background:#212a31}
.btn.pri{background:var(--ink);color:#0a0d10;border-color:var(--ink)}
.btn.pri:hover:not(:disabled){background:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.banner{grid-area:banner;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:68px}
.banner .who{display:flex;align-items:center;gap:8px;font:700 17px "Space Grotesk",sans-serif}
.banner .msg{flex:1 1 260px;color:var(--ink)}
.banner .msg em{font-style:normal;color:var(--mute)}
.banner .opts{display:flex;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;vertical-align:-2px;width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #000;box-shadow:0 0 0 1px #ffffff33}
.dice{display:flex;gap:6px}
.dice svg{width:40px;height:40px}
.dice.roll svg{animation:tumble .5s ease-out both}
.dice.roll svg+svg{animation-delay:.07s}
@keyframes tumble{0%{transform:rotate(-35deg) scale(.6);opacity:.2}70%{transform:rotate(8deg) scale(1.06)}100%{transform:none}}
.boardcol{grid-area:board;display:flex;flex-direction:column;gap:10px}
.boardbox{scroll-margin-top:130px;position:relative;border-radius:18px;background:radial-gradient(120% 90% at 30% 20%,#141b20,#0b0f12 70%);border:1px solid var(--line);overflow:hidden}
.boardbox svg{display:block;width:100%;height:auto;max-height:calc(100svh - 150px);touch-action:manipulation}
.hit{cursor:pointer}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);padding:0 4px}
.legend b{color:var(--ink);font-weight:600}
.qd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--k);color:#0a0d10;font:italic 700 13px "Space Grotesk",sans-serif;vertical-align:-4px;margin-right:3px;flex:none}
.qd.e{font-style:normal}
.cost{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center;white-space:nowrap}
.panel{grid-area:panel;display:flex;flex-direction:column;gap:12px}
@media(min-width:981px){.panel{position:sticky;top:10px;align-self:start;max-height:calc(100svh - 20px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.me{display:flex;align-items:center;gap:10px}
.me h2{margin:0;flex:1;font-size:22px}
.me .vp{font:700 30px/1 "Space Grotesk",sans-serif}
.me .vp small{font-size:15px;color:var(--mute);font-weight:500}
.res{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.res .rc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 2px 4px;text-align:center;color:inherit;font:inherit;cursor:pointer}
.res .rc:hover{border-color:#4a5862}
.res .qd{width:24px;height:24px;font-size:15px;margin:0}
.res .n{display:block;font:700 19px/1.2 "Space Grotesk",sans-serif}
.res .lab{display:block;font-size:11px;color:var(--mute);white-space:nowrap}
.res .unst{border-color:#5a3b3b}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.sym{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px "Space Grotesk",sans-serif;background:var(--panel2);border:1px solid var(--line)}
.sym.t2{border-radius:9px}
.sym.t3{border-radius:4px;font-size:12px}
.brow .nm{font-weight:600}
.brow .nm small{color:var(--mute);font-weight:500}
.brow .why{display:block;font-size:12px;color:var(--mute)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{min-height:40px;min-width:44px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;gap:2px}
.seg button[aria-pressed=true]{border-color:var(--ink);background:#2a343c}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.trow span.l{font-size:13px;color:var(--mute);width:62px}
.hand{display:grid;gap:8px}
.ic{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.ic.basic{border-color:#2f4b66}.ic.protect{border-color:#365c45}.ic.reaction{border-color:#614a2b}
.ic .hd{display:flex;align-items:baseline;gap:8px}
.ic .hd b{flex:1}
.ic .g{font-size:12px;color:var(--mute)}
.ic p{margin:4px 0 8px;font-size:13px;color:#c9d3d8}
.ic .why{font-size:12px;color:var(--mute)}
.side{grid-area:side;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl.cur .pn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pl .pn{font-weight:700}
.pl .tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:500}
.pl .pv{font:700 26px/1 "Space Grotesk",sans-serif;text-align:right}
.pl .st{grid-column:2/4;font-size:13px;color:var(--mute)}
.badges{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:12px;border-radius:6px;padding:1px 7px;background:#232c33;color:#dfe7eb}
.log{max-height:340px;overflow:auto;font-size:13px;margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-top:1px solid #1f282e;display:flex;gap:8px}
.log li .t{color:var(--mute);font-variant-numeric:tabular-nums;width:2.2em;flex:none;text-align:right}
.log li .dot{width:10px;height:10px;margin-top:4px;border-width:1px}
.ov{position:fixed;inset:0;background:#05070acc;display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{width:min(640px,100%);max-height:calc(100svh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal.wide{width:min(900px,100%)}
.modal h2{margin:0 0 6px;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.modal h3{font-size:17px;margin:20px 0 8px}
.modal p{margin:6px 0;color:#d4dde1}
.modal .lead{color:var(--mute);margin-bottom:14px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0}
.prow input{min-height:44px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;width:100%}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:#0a0d10}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--k);min-width:2px}
.hist{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;margin-top:8px}
.hist>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.hist b{color:var(--ink)}
.hb{position:relative;height:120px;width:100%;border-bottom:1px solid var(--line)}
.hb i{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 0 0;background:#5d6b74}
.hb i.f{background:var(--hot)}
.hb s{position:absolute;left:-3px;right:-3px;border-top:2px dashed #e8eef1cc;height:0}
ol.interp{padding-left:20px;margin:6px 0}
ol.interp li{margin:6px 0;color:#d4dde1}
.step{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;flex:none}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.tgrid>div{display:flex;align-items:center;gap:6px;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.tgrid>div>span:first-child{white-space:nowrap}
.foot{grid-area:foot;border-top:1px solid var(--line);padding-top:16px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:16px}
.foot img{height:72px;width:auto;flex:none}
.mhead{display:flex;align-items:flex-start;gap:16px;justify-content:space-between}
.mhead img{height:88px;width:auto;flex:none;margin:-4px -2px 0 0}
@media(max-width:640px){.mhead img{height:64px}.foot img{height:60px}}
.foot b{color:var(--ink);font-weight:600}
.phb{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid #34505f;background:transparent;color:#9fd8ff;font-size:12px;font-weight:600;margin-left:6px;vertical-align:1px}
.phb:hover{background:#16242c}
svg [data-phys]{cursor:pointer}
.legend button{background:none;border:0;color:inherit;font:inherit;padding:4px 2px;min-height:32px;cursor:pointer;border-radius:6px}
.legend button:hover b{text-decoration:underline}
.pnb{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline dotted #6c7d87;text-underline-offset:4px}
.banner.coach{border-color:#7a5a1e;background:linear-gradient(180deg,#1d1a12,var(--panel))}
.coach .stepno{font:600 13px Inter,sans-serif;color:var(--e)}
.coach .msg{flex:1 1 380px}
.prow select{min-height:44px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;width:100%}
.pbio{margin:0 0 10px 32px;font-size:13px;color:var(--mute)}
.plev{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px 32px}
.plev .l{font-size:13px;color:var(--mute);font-weight:600}
.pbio b{color:var(--ink);font-weight:600}
.phys .cat{display:block;color:var(--e);font-size:13px;font-weight:600;margin-bottom:4px}
.phys .sum{font-size:17px;line-height:1.55;color:var(--ink)}
.phys .deep{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.chip:hover{border-color:#4a5862}
.pent{border-top:1px solid var(--line);padding:12px 0}
.pent h4{margin:0 0 4px;font:600 16px "Space Grotesk",Inter,sans-serif}
.pent p{margin:4px 0}
details summary{cursor:pointer;color:#9fd8ff;font-weight:600;padding:6px 0;min-height:32px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#ffe3dc;color:#2a0c08;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 30px #0008}
@media(max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "banner" "board" "panel" "side" "foot"}
  .banner{position:sticky;top:0;z-index:6;box-shadow:0 8px 24px #000a}
  .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
  .boardbox svg{max-height:none}
  .banner.coach{position:static;box-shadow:none}
}
@media(max-width:640px){
  .side{grid-template-columns:minmax(0,1fr)}
  .res{grid-template-columns:repeat(4,minmax(0,1fr))}
  .banner{padding:8px 10px;gap:8px}
  .banner .msg{flex-basis:100%;order:3;font-size:14px}
  .top h1 small,.top .long{display:none}
  .modal{padding:16px}
  .modal h2{font-size:24px}
  .coach .msg{order:0;flex-basis:100%}
  .prow{grid-template-columns:auto minmax(0,1fr)}
  .prow>.seg{grid-column:2}
  .coach .dice{display:none}
}
@media(prefers-reduced-motion:reduce){.dice.roll svg,.pulse{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>HADRON <small id="sub">Física de partículas em 2d6</small></h1>
    <div class="sp"></div>
    <button class="btn ghost sm" id="bTut" type="button">Tutorial</button>
    <button class="btn ghost sm" id="bRules" type="button">Regras<span class="long"> e Física</span></button>
    <button class="btn sm" id="bNew" type="button">Nova partida</button>
  </header>
  <section class="banner" id="banner" aria-live="polite"></section>
  <section class="boardcol">
    <div class="boardbox" id="board"></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="panel" id="panel"></aside>
  <section class="side">
    <div class="card"><h2>Placar</h2><div id="players"></div></div>
    <div class="card"><h2>Registro</h2><ul class="log" id="log"></ul></div>

function rnd(st) { // mulberry32, estado guardado no próprio jogo

const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
function okLayout(coords, tiles) {

function makeBoard(st) {

  const S3 = Math.sqrt(3);

  const vmap = new Map(), emap = new Map(), vertices = [], edges = [];
  const key = (x, y) => Math.round(x * 100) + ',' + Math.round(y * 100);
  for (const h of hexes) {
    const ids = [];
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i - 30), x = h.x + Math.cos(a), y = h.y + Math.sin(a), k = key(x, y);
      let id = vmap.get(k);
      if (id === undefined) { id = vertices.length; vmap.set(k, id); vertices.push({ id, x, y, hexes: [], adj: [], edges: [] }); }
      vertices[id].hexes.push(h.id); ids.push(id);
    }
    h.verts = ids;
    for (let i = 0; i < 6; i++) {
      const a = ids[i], b = ids[(i + 1) % 6], k = Math.min(a, b) + '-' + Math.max(a, b);

}

// ---------------------------------------------------------------- consultas
const ownVerts = (st, pi) => entriesB(st).filter(([, b]) => b.owner === pi).map(([v]) => v);

}
const immuneBlock = b => b.type === 'kaon' || b.type === 'carbon' || !!b.shield;

// ---------------------------------------------------------------- pontos
function chainLen(st, pi) {
  const own = Object.entries(st.roads).filter(([, r]) => r.owner === pi).map(([e]) => +e);
  if (!own.length) return 0;
  const ownSet = new Set(own), used = new Set();
  const blocked = v => { const b = st.buildings[v]; return !!b && b.owner !== pi; };
  let best = 0;

    if (len > best) best = len;
    if (!start && blocked(v)) return;
    for (const e of st.board.vertices[v].edges) {
      if (!ownSet.has(e) || used.has(e)) continue;
      used.add(e);

      st.deck = shuffle(st, st.discard); st.discard = []; log(st, 'O descarte foi reembaralhado como novo baralho.');
    }
    const c = st.deck.pop();
    if (CARDS[c].group === 'point') { p.points.push(c); log(st, `${p.name} revela ${CARDS[c].name}: +1 ponto.`, pi); }
    else { p.cards.push(c); got++; }
  }

}
function cardPlayable(st, pi, id) {

  const p = st.players[pi];
  if (!p.cards.includes(id)) return false;
  const C = CARDS[id];
  if (C.cost && p.res.e < C.cost.e) return false;
  switch (id) {
    case 'forte': return !st.flags.discount;
    case 'fraca': return qCount(p) > 0;
    case 'em': case 'unificada': return true;
    case 'gravidade': return gravityOptions(st, pi).length > 0;
    case 'gauge': return ownVerts(st, pi).length > 0;
    case 'blindagem': return !p.blind;
    case 'fusao': return ownOfType(st, pi, 'deuterium').length >= 2;

      const n = BUILD[b.type].tier === 2 ? 2 : 1;

      gains[b.owner][h.kind] = (gains[b.owner][h.kind] || 0) + n;
    }
  }
  let any = false;
  gains.forEach((g, i) => { if (Object.keys(g).length) { any = true; log(st, `${pn(st, i)} recebe ${fmtRes(g)}.`, i); } });
  if (!any) log(st, 'Nenhuma construção produziu.');
}
function doRoll(st, forced) {
  const d1 = forced ? forced[0] : 1 + ri(st, 6), d2 = forced ? forced[1] : 1 + ri(st, 6), s = d1 + d2;
  st.dice = [d1, d2]; st.rolled = true; st.rolls[s]++;
  log(st, `${pn(st, st.current)} rola ${d1} + ${d2} = ${s}.`, st.current);
  if (s === 7) {
    log(st, 'Campo de Higgs ativado!');
    st.pending = { who: st.current, kind: 'higgsHex', pick: 'hex', options: st.board.hexes.map(h => h.id).filter(h => h !== st.tokens.higgs), data: { viaCard: false },
      prompt: 'Campo de Higgs: escolha o hexágono que fica sem produção. Depois você rouba 1 quark de quem estiver nele.' };
  } else if (s === 2) startDecay(st);
  else if (s === 12) startFusion(st);
  else produce(st, s);
}
function stealCandidates(st, hex, thief) {
  const set = new Set();
  for (const v of st.board.hexes[hex].verts) { const b = st.buildings[v]; if (b && b.owner !== thief) set.add(b.owner); }
  return [...set].filter(i => qCount(st.players[i]) > 0 && !stealImmune(st, i));
}
function steal(st, thief, victim) {
  const p = st.players[victim], n = qCount(p);
  if (!n) return;
  let r = ri(st, n);
  for (const k of Q) {
    if (r < p.res[k]) { p.res[k]--; st.players[thief].res[k]++; log(st, `${pn(st, thief)} rouba 1 ${QN[k]} de ${p.name}.`, thief); return; }
    r -= p.res[k];
  }
}
function loseRandom(st, pi) {
  const p = st.players[pi], n = qCount(p);
  if (!n) return null;
  let r = ri(st, n);
  for (const k of Q) { if (r < p.res[k]) { p.res[k]--; return k; } r -= p.res[k]; }
  return null;
}
function afterHiggsHex(st, hex, viaCard) {
  moveToken(st, 'higgs', hex);
  const c = stealCandidates(st, hex, st.current);
  if (!c.length) { log(st, 'Ninguém para roubar nesse hexágono.'); return; }
  if (c.length === 1) return targetSteal(st, c[0], viaCard);
  st.pending = { who: st.current, kind: 'higgsSteal', pick: 'player', options: c, data: { viaCard }, prompt: 'Escolha de quem roubar 1 quark aleatório.' };
}
function targetSteal(st, victim, viaCard) {
  if (!viaCard && askReact(st, victim, { field: 'higgs' })) return;
  steal(st, st.current, victim);
}
function askReact(st, victim, data) {
  if (!st.players[victim].cards.includes('estab')) return false;
  st.pending = { who: victim, kind: 'react', pick: 'yesno', options: [true, false], data: { ...data, victim },
    prompt: `${FIELD_NAME[data.field]} atinge você. Usar Estabilização Quântica para cancelar?` };
  return true;
}
function applyField(st, d) {
  if (d.field === 'higgs') steal(st, st.current, d.victim);
  else if (d.field === 'decay') { moveToken(st, 'decay', st.board.vertices[d.v].hexes[0]); stepDown(st, d.v, 'decai'); }
  else if (d.field === 'fusion') applyFusion(st, d.a, d.b);
}
function startDecay(st) {
  log(st, 'Campo de Decaimento ativado (força fraca)!');
  const c = entriesB(st).filter(([, b]) => b.owner !== st.current && ['deuterium', 'helium', 'lithium'].includes(b.type) && !b.shield).map(([v]) => v);
  if (!c.length) { st.players[st.current].res.e++; log(st, `Nenhum núcleo pode decair. ${pn(st, st.current)} recebe 1 Energia.`, st.current); return; }
  st.pending = { who: st.current, kind: 'decayPick', pick: 'vertex', options: c, prompt: 'Campo de Decaimento: escolha o núcleo de um oponente que perde um nível.' };
}
function stepDown(st, v, verb, toType) {
  const b = st.buildings[v], before = BUILD[b.type].name;
  b.type = toType || (b.type === 'lithium' ? 'helium' : b.type === 'helium' ? 'deuterium' : (b.base || 'proton'));
  b.heCount = 0;
  log(st, `O ${before} de ${pn(st, b.owner)} ${verb} e vira ${BUILD[b.type].name}.`, b.owner);
  const set = new Set();
  for (const h of st.board.vertices[v].hexes) for (const w of st.board.hexes[h].verts) {
    if (w === v) continue; const o = st.buildings[w]; if (o && o.owner !== b.owner) set.add(o.owner);
  }
  for (const i of set) { const k = LIGHT[ri(st, 2)]; st.players[i].res[k]++; log(st, `${pn(st, i)} captura 1 ${QN[k]} liberado.`, i); }
}
function startFusion(st) {
  log(st, 'Campo de Fusão ativado (força forte)!');
  const opp = others(st, st.current);
  if (opp.length === 2) return continueFusion(st, { field: 'fusion', a: opp[0], b: opp[1], stage: 0 });
  st.pending = { who: st.current, kind: 'fusionPick1', pick: 'player', options: opp, prompt: 'Campo de Fusão: escolha o primeiro jogador que será forçado a fundir recursos.' };
}
function continueFusion(st, d) {
  while (d.stage < 2) { const victim = d.stage === 0 ? d.a : d.b; d.stage++; if (askReact(st, victim, d)) return; }
  applyFusion(st, d.a, d.b);
}
function applyFusion(st, a, b) {
  const A = st.players[a], B = st.players[b];
  if (A.blind || B.blind) { log(st, 'A Blindagem Nuclear impediu a fusão.'); return; }
  if (qCount(A) < 2 || qCount(B) < 2) { log(st, `Fusão falhou: ${A.name} e ${B.name} precisam de 2 quarks cada.`); return; }
  for (const i of [a, b]) for (let k = 0; k < 2; k++) loseRandom(st, i);
  A.collab++; B.collab++;
  log(st, `${A.name} e ${B.name} fundem 2 quarks cada num Núcleo Colaborativo: +1 ponto para cada.`);
}
function endTurn(st) {
  const pi = st.current, p = st.players[pi], s = st.dice[0] + st.dice[1];
  if (owns(st, pi, 'carbon') && ![2, 7, 12].includes(s)) { log(st, `Carbono-12 estável: ${p.name} pesca 1 carta.`, pi); drawCards(st, pi, 1); }
  for (const q of st.players) {
    const t = q.res.t, b = q.res.b;
    if (!t && !b) continue;
    q.res.c += t; q.res.s += b; q.res.e += t + b; q.res.t = 0; q.res.b = 0;
    const parts = []; if (t) parts.push(`${t} Top → Charm`); if (b) parts.push(`${b} Bottom → Strange`);
    log(st, `Decaimento de ${q.name}: ${parts.join(', ')}, +${t + b} Energia.`);
  }
  if (p.cards.length > HAND) return askDiscard(st);
  nextTurn(st);
}
function askDiscard(st) {
  const p = st.players[st.current];
  st.pending = { who: st.current, kind: 'discard', pick: 'card', options: [...new Set(p.cards)], prompt: `Limite de ${HAND} cartas: descarte mais ${p.cards.length - HAND}.` };
}
function nextTurn(st) { st.pending = null; st.current = (st.current + 1) % st.players.length; startTurn(st); }

function playCard(st, id) {
  const pi = st.current, p = st.players[pi];
  if (!cardPlayable(st, pi, id)) throw new Error(whyNotCard(st, pi, id));
  p.cards.splice(p.cards.indexOf(id), 1); st.discard.push(id); st.flags.cardPlayed = true;
  if (CARDS[id].cost) p.res.e -= CARDS[id].cost.e;
  log(st, `${p.name} joga ${CARDS[id].name}.`, pi);
  const pend = (kind, pick, options, prompt, data) => { st.pending = { who: pi, kind, pick, options, prompt, data: data || {} }; };
  switch (id) {
    case 'forte': st.flags.discount = true; break;
    case 'fraca': pend('fraca', 'res', Q.filter(k => p.res[k] > 0), 'Escolha o quark que decai em 2 Energias.'); break;
    case 'em': case 'unificada': pend('tokenPick', 'token', FIELDS.slice(), 'Escolha o Campo Quântico que vai mover.', { card: id }); break;
    case 'gravidade': pend('gravity', 'vertex', gravityOptions(st, pi), 'Escolha a construção sua que atrai os recursos vizinhos.'); break;
    case 'gauge': pend('gauge', 'vertex', ownVerts(st, pi), 'Escolha a construção que fica protegida até o seu próximo turno.'); break;
    case 'blindagem': p.blind = true; log(st, `Os recursos de ${p.name} estão protegidos até o próximo turno dele.`, pi); break;
    case 'fusao': pend('fusao1', 'vertex', ownOfType(st, pi, 'deuterium'), 'Escolha o Deutério que vira Hélio-4.'); break;
    case 'fissao': pend('fissao', 'vertex', fissionOptions(st, pi), 'Escolha o núcleo pesado que sofre fissão.'); break;
    case 'aniquilacao': pend('aniqRes', 'res', Q.filter(k => p.res[k] >= 2), 'Escolha o par partícula/antipartícula: 2 quarks iguais (mais 2 Energias).'); break;
    case 'descoberta': drawCards(st, pi, 2); break;
    case 'colaboracao': pend('colab', 'player', others(st, pi).filter(i => st.players[i].cards.length), 'Escolha com quem trocar uma carta.'); break;
  }
}

function pick(st, val) {
  const pd = st.pending;
  if (!pd) throw new Error('Não há nada para escolher agora.');
  if (!pd.options.some(o => same(o, val))) throw new Error('Escolha inválida.');
  const pi = pd.who, p = st.players[pi], d = pd.data || {};
  st.pending = null;
  const pend = (kind, pick2, options, prompt, data) => { st.pending = { who: pi, kind, pick: pick2, options, prompt, data: data || {} }; };
  switch (pd.kind) {
    case 'setupHadron':
      st.buildings[val] = { owner: pi, type: d.type };
      log(st, `${p.name} posiciona um ${BUILD[d.type].name}.`, pi);
      pend('setupAccel', 'edge', st.board.vertices[val].edges.filter(e => !st.roads[e]), `Posicione um Tubo de Deriva grátis ligado ao seu ${BUILD[d.type].name}.`, { v: val });
      break;
    case 'setupAccel': {
      st.roads[val] = { owner: pi, type: 'drift' };
      const n = st.players.length;
      if (st.setupStep >= n) {
        const g = {};
        for (const h of st.board.vertices[d.v].hexes) {
          let k = st.board.hexes[h].kind;
          if (!isProd(k)) continue;
          if (k === 't' || k === 'b') { const to = k === 't' ? 'c' : 's'; p.res[to]++; p.res.e++; g[to] = (g[to] || 0) + 1; g.e = (g.e || 0) + 1; continue; }
          p.res[k]++; g[k] = (g[k] || 0) + 1;
        }
        log(st, `${p.name} recebe os recursos iniciais: ${fmtRes(g)}.`, pi);
      }
      st.setupStep++;
      updateLongest(st);
      if (st.setupStep < 2 * n) beginSetupStep(st);
      else { st.phase = 'play'; st.current = 0; log(st, 'Preparação concluída. Que comecem as colisões!'); startTurn(st); }
      break;
    }
    case 'higgsHex': afterHiggsHex(st, val, d.viaCard); break;
    case 'higgsSteal': targetSteal(st, val, d.viaCard); break;
    case 'react':
      if (val) { p.cards.splice(p.cards.indexOf('estab'), 1); st.discard.push('estab'); log(st, `${p.name} usa Estabilização Quântica e cancela o ${FIELD_NAME[d.field]}!`, pi); }
      else if (d.field === 'fusion') continueFusion(st, d);
      else applyField(st, d);
      break;
    case 'decayPick': {
      const owner = st.buildings[val].owner;
      if (!askReact(st, owner, { field: 'decay', v: val })) applyField(st, { field: 'decay', v: val });
      break;
    }
    case 'fusionPick1': pend('fusionPick2', 'player', others(st, pi).filter(i => i !== val), 'Escolha o segundo jogador da fusão.', { a: val }); break;
    case 'fusionPick2': continueFusion(st, { field: 'fusion', a: d.a, b: val, stage: 0 }); break;
    case 'fraca': p.res[val]--; p.res.e += 2; log(st, `${p.name} converte 1 ${QN[val]} em 2 Energias.`, pi); break;
    case 'tokenPick': pend('tokenHex', 'hex', st.board.hexes.map(h => h.id).filter(h => h !== st.tokens[val]), `Escolha o destino do ${FIELD_NAME[val]}.`, { card: d.card, token: val }); break;
    case 'tokenHex':
      if (d.card === 'unificada' && d.token === 'higgs') afterHiggsHex(st, val, true);
      else { moveToken(st, d.token, val); log(st, `${p.name} move o ${FIELD_NAME[d.token]}.`, pi); }
      break;
    case 'gravity': {
      const g = {};
      for (const h of gravityHexes(st, val)) { const k = st.board.hexes[h].kind; p.res[k]++; g[k] = (g[k] || 0) + 1; }
      log(st, `Gravidade: ${p.name} atrai ${fmtRes(g)}.`, pi);
      break;
    }
    case 'gauge': st.buildings[val].shield = true; log(st, `O ${BUILD[st.buildings[val].type].name} de ${p.name} está protegido por Simetria Gauge.`, pi); break;
    case 'fusao1': pend('fusao2', 'vertex', ownOfType(st, pi, 'deuterium').filter(v => v !== val), 'Escolha o outro Deutério, que volta ao hádron de origem.', { v1: val }); break;
    case 'fusao2': {
      const b1 = st.buildings[d.v1], b2 = st.buildings[val];
      b1.type = 'helium'; b1.heCount = 0; b2.type = b2.base || 'proton';

    }
    case 'fissao': stepDown(st, val, 'sofre fissão', 'deuterium'); break;
    case 'aniqRes': pend('aniqTarget', 'target', annihilationTargets(st, pi), 'Escolha a construção do oponente que será aniquilada.', { q: val }); break;
    case 'aniqTarget': {
      p.res[d.q] -= 2; p.res.e -= 2;
      if (val.k === 'v') { const b = st.buildings[val.id]; log(st, `${p.name} aniquila o ${BUILD[b.type].name} de ${pn(st, b.owner)}.`, pi); delete st.buildings[val.id]; }
      else { const r = st.roads[val.id]; log(st, `${p.name} aniquila um ${BUILD[r.type].name} de ${pn(st, r.owner)}.`, pi); delete st.roads[val.id]; }

      break;
    }
    case 'colab': {
      const q = st.players[val];
      const mine = p.cards.length ? p.cards.splice(ri(st, p.cards.length), 1)[0] : null;
      const theirs = q.cards.splice(ri(st, q.cards.length), 1)[0];
      p.cards.push(theirs); if (mine) q.cards.push(mine);

      break;
    }
    case 'tradeResponse': {
      const from = st.players[d.from];
      if (!val) { log(st, `${p.name} recusa a troca.`, pi); break; }

      break;
    }
    case 'discard':
      p.cards.splice(p.cards.indexOf(val), 1); st.discard.push(val);
      if (p.cards.length > HAND) askDiscard(st); else nextTurn(st);
      break;
    default: throw new Error('Escolha desconhecida: ' + pd.kind);
  }
}

function cleanRes(r) {
  const out = {};
  for (const [k, v] of Object.entries(r || {})) {
    if (!(k in QN)) throw new Error('Recurso inválido.');
    const n = Math.floor(+v);
    if (n < 0) throw new Error('Quantidade inválida.');
    if (n > 0) out[k] = n;
  }
  return out;
}

function apply(st, a) {
  if (st.phase === 'over') throw new Error('A partida terminou.');
  const pi = st.current, p = st.players[pi];
  const main = () => {
    if (st.phase !== 'play') throw new Error('Termine a preparação primeiro.');
    if (st.pending) throw new Error('Resolva a escolha pendente primeiro.');
    if (!st.rolled) throw new Error('Role os dados primeiro.');
  };
  switch (a.type) {
    case 'pick': pick(st, a.value); break;
    case 'roll':
      if (st.phase !== 'play' || st.pending || st.rolled) throw new Error('Não é hora de rolar os dados.');
      doRoll(st, a.dice); break;
    case 'build': {
      main();
      const kind = a.kind, B = BUILD[kind];
      if (!B) throw new Error('Construção desconhecida.');
      if (!buildSpots(st, pi, kind).includes(a.at)) throw new Error('Posição inválida para ' + B.name + '.');
      const cost = costOf(st, pi, kind, a.at), plan = payPlan(p, cost);
      if (!plan.ok) throw new Error('Recursos insuficientes.');
      pay(p, cost, plan);
      if (B.tier === 3) st.roads[a.at] = { owner: pi, type: kind };
      else if (B.tier === 1) st.buildings[a.at] = { owner: pi, type: kind };
      else { const b = st.buildings[a.at]; if (kind === 'deuterium') b.base = b.type; b.type = kind; b.heCount = 0; }
      if (B.baryon && st.flags.discount) st.flags.discount = false;
      log(st, `${p.name} constrói ${B.tier === 2 ? 'um núcleo de ' : ''}${B.name}${plan.useE ? ` (1 Energia no lugar de 1 ${QN[plan.useE]})` : ''}.`, pi);
      if (kind === 'lambda' || kind === 'detector') drawCards(st, pi, 1);
      updateLongest(st);
      break;
    }
    case 'bank': {
      main();
      const r = bankRatio(st, pi);
      if (!Q.includes(a.give) || !Q.includes(a.get) || a.give === a.get) throw new Error('Troca inválida.');
      if (p.res[a.give] < r) throw new Error(`Precisa de ${r} ${QN[a.give]}.`);
      p.res[a.give] -= r; p.res[a.get]++;
      log(st, `${p.name} troca ${r} ${QN[a.give]} por 1 ${QN[a.get]} com o banco.`, pi);
      break;
    }
    case 'energy':
      main();
      if (!Q.includes(a.get)) throw new Error('Troca inválida.');
      if (p.res.e < 3) throw new Error('Precisa de 3 Energias.');
      p.res.e -= 3; p.res[a.get]++;
      log(st, `${p.name} converte 3 Energias em 1 ${QN[a.get]}.`, pi);
      break;
    case 'li':
      main();
      if (!owns(st, pi, 'lithium')) throw new Error('Precisa de um Lítio-7.');
      if (st.flags.liUsed) throw new Error('A Fusão do Lítio-7 já foi usada neste turno.');
      if (a.get !== 't' && a.get !== 'b') throw new Error('Escolha Top ou Bottom.');
      if (p.res.u < 1 || p.res.d < 1) throw new Error('Precisa de 1 Up e 1 Down.');
      p.res.u--; p.res.d--; p.res[a.get]++; st.flags.liUsed = true;
      log(st, `Lítio-7: ${p.name} funde 1 Up + 1 Down em 1 ${QN[a.get]}.`, pi);
      break;
    case 'offer': {
      main();
      const to = a.to, give = cleanRes(a.give), get = cleanRes(a.get);
      if (!(to >= 0 && to < st.players.length) || to === pi) throw new Error('Escolha outro jogador.');
      if (!Object.keys(give).length || !Object.keys(get).length) throw new Error('A troca precisa ter algo dos dois lados.');
      if (!hasRes(p, give)) throw new Error('Você não tem esses recursos.');
      st.flags.offers++;
      const can = hasRes(st.players[to], get);
      st.pending = { who: to, kind: 'tradeResponse', pick: 'yesno', options: can ? [true, false] : [false], data: { from: pi, give, get },
        prompt: `${p.name} oferece ${fmtRes(give)} em troca de ${fmtRes(get)}.${can ? '' : ' (Você não tem o que foi pedido.)'}` };
      log(st, `${p.name} propõe uma troca a ${st.players[to].name}.`, pi);
      break;
    }
    case 'card': main(); playCard(st, a.id); break;
    case 'unify':
      main();
      if (!canUnify(st, pi)) throw new Error('Você precisa das 4 cartas básicas de força ao mesmo tempo.');
      for (const c of UNI) { p.cards.splice(p.cards.indexOf(c), 1); st.discard.push(c); }
      p.unified = true;
      log(st, `${p.name} completa o experimento Unificação das Forças: +2 pontos.`, pi);
      break;
    case 'end': main(); endTurn(st); break;
    default: throw new Error('Ação desconhecida.');
  }
  checkWin(st);
  return st;
}

// ---------------------------------------------------------------- ações legais (para bots e testes)
function legal(st) {
  if (st.phase === 'over') return [];
  if (st.pending) return st.pending.options.map(o => ({ type: 'pick', value: o }));
  if (!st.rolled) return [{ type: 'roll' }];
  const pi = st.current, p = st.players[pi], acts = [];
  for (const kind of Object.keys(BUILD)) for (const at of buildSpots(st, pi, kind)) if (payPlan(p, costOf(st, pi, kind, at)).ok) acts.push({ type: 'build', kind, at });
  const r = bankRatio(st, pi);
  for (const g of Q) if (p.res[g] >= r) for (const k of Q) if (k !== g) acts.push({ type: 'bank', give: g, get: k });
  if (p.res.e >= 3) for (const k of Q) acts.push({ type: 'energy', get: k });
  if (owns(st, pi, 'lithium') && !st.flags.liUsed && p.res.u && p.res.d) acts.push({ type: 'li', get: 't' }, { type: 'li', get: 'b' });
  for (const id of new Set(p.cards)) if (cardPlayable(st, pi, id)) acts.push({ type: 'card', id });
  if (canUnify(st, pi)) acts.push({ type: 'unify' });
  acts.push({ type: 'end' });
  return acts;
}

// ---------------------------------------------------------------- computador
// Três níveis: 1 = fácil (joga quase ao acaso), 2 = médio (guloso), 3 = difícil (planeja trocas e cartas).
const KIND_W = { u: 1.25, d: 1.2, c: 0.8, s: 0.9, t: 0.45, b: 0.45 };
function vertexScore(st, v) {
  return st.board.vertices[v].hexes.reduce((s, h) => { const H = st.board.hexes[h]; return s + (isProd(H.kind) ? prob(H.num) * KIND_W[H.kind] : 0); }, 0);
}
const levelOf = (st, i) => st.players[i].level || 2;
function leader(st, list) { let best = list[0], bv = -1; for (const i of list) { const v = vp(st, i); if (v > bv) { bv = v; best = i; } } return best; }

  d: 'Carga de −1/3 e massa de cerca de 4,7 MeV/c².\n\nQuando um nêutron decai, um de seus quarks down vira up pela força fraca, emitindo um elétron e um antineutrino. É o decaimento beta, a radioatividade mais comum.\n\nNo jogo, Up e Down dividem os números 6 e 8, os mais prováveis depois do 7.' },
q_c: { cat: 'quarks', t: 'Quark charm', see: ['acc_sync', 'abund'],
  s: 'Um primo mais pesado do up, da segunda geração. Só aparece em colisões de alta energia e decai rapidamente.',
  d: 'Carga de +2/3 e massa de cerca de 1,27 GeV/c², maior que a de um próton inteiro.\n\nFoi previsto pela teoria em 1970 (mecanismo GIM) e descoberto em novembro de 1974, quando dois grupos, no SLAC e em Brookhaven, encontraram ao mesmo tempo a partícula J/ψ, feita de um charm e um anticharm. O episódio ficou conhecido como Revolução de Novembro e rendeu o Nobel de 1976 a Burton Richter e Samuel Ting.\n\nNo jogo, o Charm sai em 36,1% das rolagens e é usado nos Tubos de Deriva.' },
q_s: { cat: 'quarks', t: 'Quark strange', see: ['kaon', 'lambda', 'acc_ion'],
  s: 'O quark "estranho", da segunda geração. Partículas com strange vivem muito mais do que deveriam, e esse comportamento lhe deu o nome.',
  d: 'Carga de −1/3 e massa de cerca de 93 MeV/c².\n\nNo fim dos anos 1940, partículas encontradas nos raios cósmicos, como os káons e o lambda, eram criadas com facilidade mas decaíam devagar demais. Murray Gell-Mann e Kazuhiko Nishijima explicaram isso em 1953 com um novo número quântico, a estranheza, que a força forte conserva e a força fraca não.\n\nNo jogo, o Strange entra no Lambda, no Káon e nos Tubos de Deriva.' },
q_t: { cat: 'quarks', t: 'Quark top', see: ['acc_big', 'force_weak', 'energia'],
  s: 'O quark mais pesado: sua massa é comparável à de um átomo de ouro inteiro. Vive tão pouco que decai antes de formar qualquer hádron.',
  d: 'Carga de +2/3 e massa de cerca de 173 GeV/c². Foi descoberto em 1995 no Fermilab, nos Estados Unidos, pelos experimentos CDF e DØ.\n\nSeu tempo de vida é de cerca de 5 × 10⁻²⁵ s, menor do que o tempo que a força forte leva para prendê-lo a outro quark. É o único quark que pode ser estudado "nu".\n\nNa natureza, o top decai quase sempre em um bottom e um bóson W⁺. O jogo simplifica: o Top que você não usa no turno decai em Charm + Energia. A regra captura a instabilidade, não o canal exato de decaimento.' },
q_b: { cat: 'quarks', t: 'Quark bottom', see: ['acc_big', 'detector'],
  s: 'O parceiro do top na terceira geração. Forma mésons B, que vivem cerca de um trilionésimo de segundo.',
  d: 'Carga de −1/3 e massa de cerca de 4,18 GeV/c². Descoberto em 1977 no Fermilab pela equipe de Leon Lederman, por meio da partícula Υ (upsilon), um par bottom e antibottom.\n\nMésons B vivem cerca de 1,5 × 10⁻¹² s, tempo para percorrer alguns milímetros num detector, o que permite reconhecê-los. Na natureza, o bottom decai principalmente em charm.\n\nNo jogo, o Bottom que sobra no fim do turno decai em Strange + Energia.' },
energia: { cat: 'quarks', t: 'Energia', see: ['annihilation', 'q_t'],
  s: 'Massa e energia são duas faces da mesma coisa: E = mc². Quando partículas pesadas decaem em partículas leves, a diferença de massa vira energia.',
  d: 'Nos aceleradores acontece o caminho inverso: a energia do movimento das partículas que colidem vira massa de partículas novas. É assim que se criam quarks pesados como o top.\n\nPor isso a Física de partículas mede massas em unidades de energia. Um próton tem cerca de 0,94 GeV/c², ou seja, quase 1 GeV.\n\nNo jogo, a Energia nasce dos decaimentos de Top e Bottom e paga antipartículas, cartas e construções especiais.' },
abund: { cat: 'quarks', t: 'Por que os quarks têm raridades diferentes', see: ['q_u', 'q_t', 'acc_ion'],
  s: 'Tudo o que é estável no universo é feito de up e down. Os outros quatro quarks só aparecem em colisões energéticas e desaparecem em frações de segundo.',
  d: 'Quanto mais pesado o quark, mais energia é preciso para criá-lo (E = mc²) e mais depressa ele decai em quarks mais leves pela força fraca. Quarks pesados existem hoje em aceleradores e em raios cósmicos, e foram abundantes nos primeiros microssegundos depois do Big Bang, no plasma de quarks e glúons.\n\nOs hexágonos do HADRON seguem essa ordem: Up 38,9%, Down 36,1%, Charm 36,1%, Strange 33,3%, e Top e Bottom só 5,6% cada por rolagem. Os números somam mais de 100% porque um mesmo número pode estar em vários hexágonos.' },

// ------------------------------------------------------------ hádrons
proton: { cat: 'hadrons', t: 'Próton (uud)', see: ['q_u', 'q_d', 'force_strong'],
  s: 'Dois ups e um down presos pela força forte. É estável: os prótons do seu corpo existem desde os primeiros minutos do universo.',
  d: 'Massa de 938,3 MeV/c² e carga +1. Um fato surpreendente: as massas dos três quarks somam só cerca de 1% da massa do próton. O resto vem da energia da força forte, isto é, dos glúons e do movimento dos quarks lá dentro.\n\nNunca se observou um próton decair. Os experimentos indicam que, se ele decai, sua vida média passa de 10³⁴ anos, muitíssimo mais que a idade do universo.\n\nO núcleo do átomo de hidrogênio comum é um próton sozinho.' },
neutron: { cat: 'hadrons', t: 'Nêutron (udd)', see: ['q_d', 'force_weak', 'deuterium'],
  s: 'Um up e dois downs. Sozinho, vive cerca de 15 minutos; dentro de um núcleo pode ficar estável para sempre.',
  d: 'Massa de 939,6 MeV/c², um pouco maior que a do próton, e carga zero. Foi descoberto por James Chadwick em 1932.\n\nFora do núcleo, decai em próton, elétron e antineutrino, com vida média de cerca de 880 s. Dentro de núcleos estáveis, a energia de ligação impede esse decaimento.\n\nNo jogo, Próton e Nêutron são as peças iniciais porque são os blocos de todos os núcleos.' },
lambda: { cat: 'hadrons', t: 'Lambda Λ⁰ (uds)', see: ['q_s', 'deuterium'],
  s: 'Um bárion com um quark strange. Foi uma das "partículas estranhas" encontradas nos raios cósmicos.',
  d: 'Massa de 1115,7 MeV/c² e vida média de 2,6 × 10⁻¹⁰ s. Decai principalmente em próton e píon, ou em nêutron e píon.\n\nUm lambda pode ficar preso dentro de um núcleo e formar um hipernúcleo, observado pela primeira vez em emulsões nucleares em 1953. É por isso que, no jogo, o Lambda pode evoluir para núcleo como se fosse um Próton.' },
pion: { cat: 'hadrons', t: 'Píon (u + anti-d)', see: ['force_strong', 'sci_cesar', 'annihilation'],
  s: 'O méson mais leve, feito de um quark e um antiquark. É o mensageiro que mantém prótons e nêutrons unidos no núcleo.',
  d: 'O píon carregado π⁺ tem massa de 139,6 MeV/c² e vive 2,6 × 10⁻⁸ s. Hideki Yukawa previu sua existência em 1935 como portador da força nuclear.\n\nEm 1947, o brasileiro César Lattes, com Giuseppe Occhialini e Cecil Powell, encontrou píons em emulsões nucleares expostas a raios cósmicos em montanhas. Em 1948, Lattes e Eugene Gardner detectaram píons produzidos artificialmente no acelerador de Berkeley.\n\nNo jogo, o Píon leva um antiquark (anti-d), por isso custa 2 Energias a mais.' },
kaon: { cat: 'hadrons', t: 'Káon (u + anti-s)', see: ['q_s', 'higgs'],
  s: 'Um méson com estranheza. Os káons revelaram que a natureza não trata matéria e antimatéria exatamente do mesmo jeito.',
  d: 'O K⁺ tem massa de 493,7 MeV/c² e vive 1,2 × 10⁻⁸ s. Foi descoberto nos raios cósmicos em 1947 por George Rochester e Clifford Butler, como uma "partícula V".\n\nEm 1964, James Cronin e Val Fitch mostraram que káons neutros violam a simetria CP, uma pista de por que o universo tem muito mais matéria que antimatéria.\n\nNo jogo, o Káon é imune ao Campo de Higgs. Isso é uma licença do jogo, não uma propriedade física.' },

// ------------------------------------------------------------ núcleos
deuterium: { cat: 'nuclei', t: 'Deutério ²H', see: ['proton', 'neutron', 'helium'],
  s: 'Um próton e um nêutron: o núcleo mais simples depois do hidrogênio comum. Foi o primeiro passo da construção dos elementos no Big Bang.',
  d: 'A energia de ligação do deutério é de só 2,22 MeV. É tão pequena que, nos primeiros minutos do universo, a radiação quente o quebrava logo depois de formado: o chamado gargalo do deutério. Só quando o universo esfriou, uns três minutos após o Big Bang, o deutério sobreviveu e a formação de núcleos avançou.\n\nNa água do mar há cerca de 1 deutério para cada 6.400 hidrogênios.\n\nNo jogo, ele evolui de um Próton ou de um Nêutron pagando só o núcleon que falta.' },
helium: { cat: 'nuclei', t: 'Hélio-4 ⁴He', see: ['deuterium', 'sci_maria', 'nuc_fusion'],
  s: 'Dois prótons e dois nêutrons, fortemente ligados. É a partícula alfa da radioatividade e um quarto da massa da matéria comum do universo.',
  d: 'Energia de ligação de 28,3 MeV, cerca de 7 MeV por núcleon. É muito estável porque 2 prótons e 2 nêutrons completam as primeiras camadas do núcleo: é um núcleo "duplamente mágico".\n\nQuase todo o hélio-4 do universo foi feito nos primeiros 20 minutos após o Big Bang, cerca de 25% da massa da matéria comum. Nas estrelas como o Sol, hidrogênio vira hélio por fusão.\n\nNo jogo, o Hélio-4 gera Energia a cada turno.' },
lithium: { cat: 'nuclei', t: 'Lítio-7 ⁷Li', see: ['helium', 'carbon'],
  s: 'Três prótons e quatro nêutrons: o elemento mais pesado criado em quantidade apreciável pelo Big Bang.',
  d: 'A nucleossíntese primordial produziu hidrogênio, hélio e um pouco de lítio-7. Curiosamente, estrelas muito antigas mostram cerca de três vezes menos lítio do que a teoria prevê. É o "problema do lítio cosmológico", ainda sem solução.\n\nO lítio é frágil: é destruído a temperaturas relativamente baixas dentro das estrelas.\n\nNo jogo, o Lítio-7 não dá pontos extras, mas sua habilidade transforma quarks leves em pesados.' },
carbon: { cat: 'nuclei', t: 'Carbono-12 ¹²C', see: ['helium', 'nuc_fusion'],
  s: 'Seis prótons e seis nêutrons. A base da vida foi forjada nas estrelas, quando três núcleos de hélio se fundem.',
  d: 'O Big Bang não fez carbono. Ele nasce no processo triplo-alfa, em estrelas gigantes vermelhas: dois núcleos de hélio-4 formam berílio-8, que dura só cerca de 10⁻¹⁶ s; se um terceiro hélio chega a tempo, forma-se carbono-12.\n\nIsso só acontece com frequência porque o carbono tem um estado excitado com a energia certa, previsto por Fred Hoyle em 1953 e encontrado em laboratório logo depois.\n\nNo jogo, o Carbono-12 evolui de um Hélio-4 com 2 Energias. É uma simplificação: na natureza são precisos três núcleos de hélio.' },

// ------------------------------------------------------------ máquinas
acc_linear: { cat: 'machines', t: 'Acelerador linear', see: ['q_u', 'q_d', 'drift', 'chain'],
  s: 'Um tubo reto em que campos elétricos empurram partículas cada vez mais rápido. No jogo, produz Up e Down.',
  d: 'O primeiro acelerador linear com ondas de rádio foi construído por Rolf Widerøe em 1928. O maior em linha reta é o do SLAC, na Califórnia, com cerca de 3 km, onde se viram pela primeira vez os quarks dentro do próton.\n\nNo CERN, todo próton que chega ao LHC começa num acelerador linear, o Linac 4.' },
acc_sync: { cat: 'machines', t: 'Síncrotron', see: ['q_c', 'magnet'],
  s: 'Um anel em que ímãs curvam as partículas e campos elétricos as aceleram a cada volta. No jogo, produz Charm.',
  d: 'No síncrotron, o campo magnético cresce junto com a energia, para manter as partículas na mesma órbita.\n\nSíncrotrons também produzem uma luz muito intensa, a radiação síncrotron, usada em biologia, medicina e ciência dos materiais. No Brasil, o Sirius, em Campinas, é uma das fontes de luz síncrotron mais avançadas do mundo.' },
acc_ion: { cat: 'machines', t: 'Colisor de íons', see: ['q_s', 'abund'],
  s: 'Colide núcleos pesados, como ouro ou chumbo, para recriar a sopa de quarks e glúons dos primeiros microssegundos do universo. No jogo, produz Strange.',
  d: 'Nessas colisões, a temperatura passa de um trilhão de graus e os prótons e nêutrons "derretem" num plasma de quarks e glúons. O RHIC, em Brookhaven, e o experimento ALICE, no LHC, estudam esse estado da matéria.\n\nUm sinal clássico do plasma é o excesso de partículas com quark strange. Por isso o jogo associa o Strange a esses colisores.' },
acc_big: { cat: 'machines', t: 'Grande colisor', see: ['q_t', 'q_b', 'exp_higgs'],
  s: 'Um anel gigante que colide prótons com energia suficiente para criar as partículas mais pesadas que se conhecem. No jogo, produz Top e Bottom.',
  d: 'O LHC, no CERN, tem 27 km de circunferência e colide prótons com até 13,6 TeV. Lá se produzem quarks top aos milhões e se descobriu o bóson de Higgs, em 2012. O top foi descoberto antes, em 1995, no Tevatron do Fermilab.\n\nPor isso Top e Bottom estão nos hexágonos mais raros do jogo: são precisas as máquinas mais poderosas para produzi-los.' },
drift: { cat: 'machines', t: 'Tubo de deriva', see: ['acc_linear', 'chain'],
  s: 'Peça dos aceleradores lineares: dentro do tubo a partícula "deriva", protegida do campo elétrico, e ganha energia nos vãos entre um tubo e outro.',
  d: 'Nos aceleradores de Widerøe e Alvarez, os tubos ficam cada vez mais longos ao longo da máquina. Como a partícula anda mais rápido a cada vão, precisa percorrer mais distância no mesmo meio ciclo da onda de rádio.\n\nNo jogo, os Tubos de Deriva são as conexões entre suas construções.' },
magnet: { cat: 'machines', t: 'Ímã supercondutor', see: ['acc_sync', 'acc_big'],
  s: 'Ímãs que conduzem corrente sem nenhuma resistência quando resfriados perto do zero absoluto, gerando campos enormes para curvar feixes.',
  d: 'O LHC usa 1.232 ímãs dipolares de nióbio-titânio, resfriados a 1,9 K (−271 °C) com hélio superfluido. Eles geram 8,3 tesla, mais de 100 mil vezes o campo magnético da Terra.\n\nNo jogo, o Ímã exige um Top, a partícula de energia mais alta, e vale 2 na maior cadeia.' },
detector: { cat: 'machines', t: 'Detector', see: ['bubble', 'q_b'],
  s: 'O "olho" do físico: registra a passagem das partículas criadas numa colisão para reconstruir o que aconteceu.',
  d: 'Detectores modernos como o ATLAS e o CMS, no LHC, são feitos de camadas. Rastreadores de silício medem trajetórias, calorímetros medem energias e câmaras de múons ficam na parte de fora. Um campo magnético curva as trajetórias, e a curvatura revela a carga e o momento de cada partícula.\n\nO Detector do jogo exige um Bottom: reconhecer quarks bottom é uma das especialidades dos rastreadores de silício.' },
bubble: { cat: 'machines', t: 'Câmara de bolhas (o fundo do tabuleiro)', see: ['detector', 'kaon'],
  s: 'As espirais no fundo do tabuleiro imitam fotos de câmaras de bolhas: partículas carregadas deixam um rastro de bolhinhas num líquido superaquecido.',
  d: 'Inventada por Donald Glaser em 1952 (Nobel de 1960), a câmara de bolhas foi o principal detector dos anos 1960 e 1970. Num campo magnético, partículas carregadas fazem curvas; ao perder energia, a curva se fecha numa espiral.\n\nMuitas partículas do jogo, como káons e lambdas, foram estudadas assim, em milhões de fotografias analisadas à mão.' },
chain: { cat: 'machines', t: 'Cadeia de aceleradores', see: ['acc_linear', 'acc_big', 'drift'],
  s: 'No CERN, os prótons passam por uma cadeia de máquinas antes de chegar ao LHC, ganhando energia em cada etapa.',
  d: 'O caminho atual é Linac 4 → Booster do PS → PS → SPS → LHC. Cada máquina recebe o feixe da anterior e o leva a uma energia maior.\n\nA Maior Cadeia de Aceleradores do jogo, que vale 2 pontos a partir de 5 conexões, homenageia essa ideia.' },

// ------------------------------------------------------------ forças
higgs: { cat: 'forces', t: 'Campo de Higgs', see: ['exp_higgs', 'proton', 'force_weak'],
  s: 'Um campo que preenche todo o espaço e dá massa às partículas fundamentais que interagem com ele. Sua partícula, o bóson de Higgs, foi descoberta em 2012.',
  d: 'Proposto em 1964 por Peter Higgs, François Englert, Robert Brout e outros, o mecanismo explica por que os bósons W e Z têm massa enquanto o fóton não tem, e dá massa a quarks e léptons.\n\nO bóson de Higgs, com cerca de 125 GeV/c², foi anunciado pelos experimentos ATLAS e CMS em 4 de julho de 2012. Higgs e Englert receberam o Nobel de 2013.\n\nAtenção a uma confusão comum: o Higgs explica a massa dos quarks, mas a maior parte da massa do próton vem da força forte.\n\nNo jogo, o Campo de Higgs (dados = 7) "pesa" sobre um hexágono e bloqueia sua produção.' },
force_weak: { cat: 'forces', t: 'Força fraca (Campo de Decaimento)', see: ['q_d', 'sci_wu', 'sci_enrico'],
  s: 'A única força capaz de transformar um tipo de quark em outro. É ela que faz núcleos radioativos decaírem.',
  d: 'É transmitida pelos bósons W⁺, W⁻ e Z⁰, quase 100 vezes mais pesados que o próton, o que deixa a força fraca com alcance minúsculo.\n\nEnrico Fermi escreveu a primeira teoria do decaimento beta em 1934. Em 1956 e 1957, Chien-Shiung Wu mostrou que a força fraca distingue esquerda de direita (violação de paridade). Os bósons W e Z foram descobertos no CERN em 1983.\n\nNo jogo, o Campo de Decaimento (dados = 2) rebaixa um núcleo, e a ficha W± marca onde ele agiu.' },
force_strong: { cat: 'forces', t: 'Força forte (Campo de Fusão)', see: ['proton', 'pion', 'nuc_fusion'],
  s: 'A força mais intensa da natureza: prende os quarks dentro dos prótons e, de forma residual, prende prótons e nêutrons no núcleo.',
  d: 'Seus mensageiros são os glúons, a ficha g do jogo. Existem oito tipos, e eles carregam "carga de cor".\n\nDiferente das outras forças, ela fica mais forte quando os quarks se afastam, por isso nunca se vê um quark isolado (confinamento). Em distâncias muito curtas, os quarks ficam quase livres (liberdade assintótica, Nobel de 2004). Entre prótons e nêutrons, a força nuclear é um efeito residual dela, transmitido em boa parte por píons.\n\nNo jogo, o Campo de Fusão (dados = 12) força dois jogadores a juntar recursos.' },
force_em: { cat: 'forces', t: 'Força eletromagnética', see: ['unif', 'magnet'],
  s: 'A força entre cargas elétricas, transmitida por fótons. É responsável pela luz, pela química e por quase tudo do dia a dia.',
  d: 'Dentro do núcleo, ela trabalha contra a ligação: os prótons se repelem eletricamente, e por isso núcleos muito pesados ficam instáveis.\n\nNos aceleradores, campos elétricos aceleram as partículas e campos magnéticos curvam suas trajetórias. A teoria quântica dessa força, a eletrodinâmica quântica, é uma das teorias mais bem testadas da ciência.\n\nNo jogo, a carta Força Eletromagnética move um campo, como um ímã desvia um feixe.' },
force_grav: { cat: 'forces', t: 'Gravidade', see: ['carbon', 'unif'],
  s: 'A força que domina planetas e galáxias, mas é desprezível entre partículas: entre dois prótons, é cerca de 10³⁶ vezes mais fraca que a repulsão elétrica.',
  d: 'A gravidade não faz parte do Modelo Padrão, e ainda não existe uma teoria quântica da gravidade confirmada por experimentos. O gráviton, seu mensageiro, é hipotético.\n\nMesmo assim, foi a gravidade que juntou o gás em estrelas, onde núcleos como o carbono são forjados.\n\nNo jogo, a carta Gravidade atrai quarks dos hexágonos vizinhos.' },
unif: { cat: 'forces', t: 'Unificação das forças', see: ['force_em', 'force_weak', 'gauge'],
  s: 'Forças que parecem diferentes podem ser faces de uma só. A eletromagnética e a fraca já foram unificadas na força eletrofraca.',
  d: 'Sheldon Glashow, Abdus Salam e Steven Weinberg construíram a teoria eletrofraca nos anos 1960 (Nobel de 1979), confirmada com a descoberta dos bósons W e Z em 1983. Em energias altíssimas, as duas forças se comportam como uma só.\n\nTeorias de grande unificação tentam incluir também a força forte, mas ainda não têm confirmação experimental, e a gravidade continua de fora.\n\nNo jogo, juntar as quatro cartas de força completa o experimento Unificação, e dois campos no mesmo hexágono disparam a Unificação Eletrofraca.' },
gauge: { cat: 'forces', t: 'Simetria de gauge', see: ['sci_emmy', 'unif'],
  s: 'As forças fundamentais nascem de simetrias: transformações que deixam as leis da Física iguais.',
  d: 'No Modelo Padrão, a força forte vem da simetria SU(3) e a eletrofraca, de SU(2) × U(1). Exigir que essas simetrias valham em cada ponto do espaço obriga a existir partículas mensageiras: glúons, bósons W e Z, e o fóton.\n\nO teorema de Emmy Noether (1918) mostra que cada simetria contínua corresponde a uma quantidade conservada, como a energia ou a carga elétrica.\n\nNo jogo, a carta Simetria Gauge protege uma construção, como uma simetria protege uma grandeza de mudar.' },

// ------------------------------------------------------------ fenômenos e cartas
nuc_fusion: { cat: 'phenomena', t: 'Fusão nuclear', see: ['helium', 'force_strong'],
  s: 'Núcleos leves se juntam e liberam energia. É o que acende o Sol.',
  d: 'No Sol, quatro prótons viram um hélio-4 numa cadeia de reações, liberando 26,7 MeV por hélio. A massa final é cerca de 0,7% menor que a inicial, e essa diferença vira energia (E = mc²). Reatores experimentais, como o ITER, na França, tentam reproduzir isso na Terra.\n\nA carta Fusão Nuclear junta dois deutérios num hélio-4. Na prática, a fusão de dois deutérios quase sempre gera hélio-3 ou trítio; formar hélio-4 diretamente é raro.' },
nuc_fission: { cat: 'phenomena', t: 'Fissão nuclear', see: ['sci_lise', 'neutron'],
  s: 'Um núcleo pesado se parte em dois menores e libera muita energia. Foi explicada por Lise Meitner e Otto Frisch em 1939.',
  d: 'Quando o urânio-235 absorve um nêutron, ele se divide em dois fragmentos, solta 2 ou 3 nêutrons e libera cerca de 200 MeV, milhões de vezes mais energia que uma reação química. Os nêutrons liberados podem provocar novas fissões: é a reação em cadeia, controlada em usinas como as de Angra dos Reis.\n\nNúcleos leves como o hélio-4 não sofrem fissão desse jeito. A carta do jogo é uma licença para representar a quebra de núcleos.' },
annihilation: { cat: 'phenomena', t: 'Aniquilação e antimatéria', see: ['energia', 'pion', 'kaon'],
  s: 'Quando uma partícula encontra sua antipartícula, as duas desaparecem e viram energia.',
  d: 'A antimatéria foi prevista por Paul Dirac em 1928. O pósitron, o antielétron, foi descoberto por Carl Anderson em 1932, e o antipróton, em Berkeley, em 1955.\n\nNa aniquilação, toda a massa vira energia: um elétron e um pósitron produzem dois fótons de 511 keV, que são detectados nos exames de PET em hospitais. Por que o universo ficou com matéria e quase nenhuma antimatéria ainda é uma pergunta aberta.\n\nNo jogo, uma antipartícula custa a partícula + 2 Energias, e um par paga a Aniquilação.' },
shield: { cat: 'phenomena', t: 'Blindagem', see: ['nuc_fission'],
  s: 'Materiais densos ou espessos absorvem radiação e protegem pessoas e equipamentos.',
  d: 'Chumbo e concreto barram raios gama; água e materiais com muito hidrogênio freiam nêutrons; uma folha de papel basta para partículas alfa. Aceleradores e reatores ficam cercados por metros de concreto e terra.\n\nNo jogo, a Blindagem Nuclear protege seus recursos por uma rodada.' },
stab: { cat: 'phenomena', t: 'Estabilidade e leis de conservação', see: ['proton', 'gauge'],
  s: 'Partículas e núcleos estáveis são aqueles que não têm para onde decair sem violar uma lei de conservação.',
  d: 'Um núcleo é estável quando nenhum decaimento possível libera energia, ou quando o decaimento é proibido por alguma lei de conservação. O próton, por exemplo, é o bárion mais leve: a conservação do número bariônico o impede de decair.\n\nNa natureza não existe um botão para cancelar um decaimento. A carta Estabilização Quântica é uma licença do jogo inspirada nessas leis.' },
discovery: { cat: 'phenomena', t: 'Descoberta científica', see: ['exp_higgs', 'abund'],
  s: 'Na Física de partículas, uma descoberta exige evidência fortíssima: a chance de o sinal ser só uma flutuação estatística precisa ser menor que 1 em 3,5 milhões.',
  d: 'Esse critério é chamado de "5 sigma" e foi o usado no anúncio do bóson de Higgs, em 2012. A estatística é uma ferramenta central da Física, assim como as probabilidades dos dados neste jogo.' },
collab: { cat: 'phenomena', t: 'Colaboração científica', see: ['acc_big', 'exp_higgs'],
  s: 'Os grandes experimentos reúnem milhares de cientistas de dezenas de países.',
  d: 'As colaborações ATLAS e CMS, no LHC, têm cada uma milhares de pesquisadores. Físicos brasileiros participam de experimentos do CERN como ATLAS, CMS, LHCb e ALICE, e desde março de 2024 o Brasil é Estado Membro Associado do CERN, o primeiro das Américas.\n\nNo jogo, a carta Colaboração Acadêmica troca cartas entre laboratórios.' },
nobel: { cat: 'phenomena', t: 'Publicação e Prêmio Nobel', see: ['discovery', 'collab'],
  s: 'Uma descoberta vira conhecimento quando é publicada e verificada por outros cientistas.',
  d: 'Artigos passam por revisão de outros especialistas antes de sair em revistas como a Nature ou a Physical Review. O Nobel de Física é dado desde 1901; entre os premiados por Física de partículas estão Yukawa (1949), Powell (1950), Gell-Mann (1969) e Englert e Higgs (2013).\n\nAs cartas de ponto do jogo representam esse reconhecimento.' },

// ------------------------------------------------------------ experimentos
exp_higgs: { cat: 'experiments', t: 'Experimento Bóson de Higgs', see: ['higgs', 'acc_big', 'discovery'],
  s: 'Encontrar o bóson de Higgs exigiu o maior acelerador do mundo e dois detectores gigantes.',
  d: 'O ATLAS e o CMS viram o Higgs decaindo, por exemplo, em dois fótons ou em quatro léptons: um pequeno excesso de eventos em torno de 125 GeV, acima do esperado só com o ruído de fundo.\n\nNo jogo, o experimento exige ter os quatro núcleos ao mesmo tempo (Deutério, Hélio-4, Lítio-7 e Carbono-12) e vale 3 pontos.' },
exp_susy: { cat: 'experiments', t: 'Supersimetria', see: ['pion', 'kaon', 'gauge'],
  s: 'Uma hipótese: cada partícula teria uma parceira supersimétrica, trocando férmions por bósons.',
  d: 'A supersimetria resolveria alguns problemas da teoria e daria candidatas à matéria escura. Até hoje, porém, nenhuma partícula supersimétrica foi encontrada no LHC.\n\nNo jogo, o experimento pede 3 mésons em campo, pares de partícula e antipartícula, e vale 2 pontos.' },

// ------------------------------------------------------------ cientistas
sci_marie: { cat: 'people', t: 'Marie Curie (1867–1934)', see: ['nuc_fission'],
  s: 'Pioneira da radioatividade, descobriu o polônio e o rádio. Foi a primeira mulher a ganhar um Nobel e é a única pessoa premiada em duas ciências diferentes.',
  d: 'Recebeu o Nobel de Física em 1903, com Pierre Curie e Henri Becquerel, e o de Química em 1911. Criou o termo "radioatividade" e propôs que a radiação era uma propriedade dos próprios átomos, uma pista de que existia algo dentro deles.' },
sci_enrico: { cat: 'people', t: 'Enrico Fermi (1901–1954)', see: ['force_weak', 'nuc_fission'],
  s: 'Escreveu a primeira teoria da força fraca e coordenou o primeiro reator nuclear.',
  d: 'Sua teoria do decaimento beta, de 1934, popularizou o nome neutrino ("pequeno neutro", em italiano). Ganhou o Nobel de 1938. Em 1942, em Chicago, coordenou a primeira reação em cadeia controlada. Partículas como quarks e elétrons se chamam férmions em sua homenagem.' },
sci_elisa: { cat: 'people', t: 'Elisa Frota-Pessôa (1921–2018)', see: ['pion', 'kaon'],
  s: 'Uma das duas primeiras mulheres formadas em Física no Brasil e uma das fundadoras do Centro Brasileiro de Pesquisas Físicas (CBPF), em 1949.',
  d: 'Com Neusa Margem, escreveu o primeiro artigo de pesquisa feito no CBPF, sobre o decaimento de mésons observado em emulsões nucleares. Coordenou o Laboratório de Emulsões Nucleares do CBPF até 1964 e estudou mésons K com grupos europeus. É uma das pioneiras da Física de partículas no país.' },
sci_lise: { cat: 'people', t: 'Lise Meitner (1878–1968)', see: ['nuc_fission'],
  s: 'Explicou, com o sobrinho Otto Frisch, como o núcleo de urânio se divide: a fissão nuclear, em 1939.',
  d: 'Austríaca, trabalhou por três décadas em Berlim com Otto Hahn e teve de fugir da Alemanha nazista em 1938. O Nobel pela fissão (Química, 1944) foi só para Hahn, uma omissão hoje muito lembrada. O elemento 109, o meitnério, leva seu nome.' },
sci_mario: { cat: 'people', t: 'Mário Schenberg (1914–1990)', see: ['force_weak', 'energia'],
  s: 'Físico teórico nascido no Recife. Com George Gamow, explicou em 1941 como a perda de neutrinos faz estrelas colapsarem: o processo Urca.',
  d: 'Gamow batizou o processo com o nome do Cassino da Urca, no Rio de Janeiro: a energia sumia do centro da estrela tão depressa quanto o dinheiro dos apostadores. Schenberg também trabalhou com Subrahmanyan Chandrasekhar e foi um dos maiores nomes da Física teórica no Brasil.' },
sci_maria: { cat: 'people', t: 'Maria Goeppert Mayer (1906–1972)', see: ['helium', 'carbon'],
  s: 'Criou o modelo de camadas do núcleo, que explica por que alguns núcleos são extremamente estáveis.',
  d: 'Núcleos com 2, 8, 20, 28, 50, 82 ou 126 prótons ou nêutrons, os "números mágicos", são especialmente estáveis. O hélio-4, com 2 prótons e 2 nêutrons, é duplamente mágico. Ela recebeu o Nobel de Física de 1963, a segunda mulher a ganhá-lo.' },
sci_wu: { cat: 'people', t: 'Chien-Shiung Wu (1912–1997)', see: ['force_weak'],
  s: 'Mostrou, num experimento com cobalto-60 em 1956 e 1957, que a força fraca distingue esquerda de direita.',
  d: 'A descoberta derrubou a crença de que as leis da Física são idênticas num espelho, a conservação da paridade. Tsung-Dao Lee e Chen-Ning Yang, que propuseram a ideia, receberam o Nobel de 1957; Wu não foi incluída. Ela já era referência mundial em decaimento beta.' },
sci_murray: { cat: 'people', t: 'Murray Gell-Mann (1929–2019)', see: ['q_u', 'q_s'],
  s: 'Propôs em 1964 que prótons, nêutrons e mésons são feitos de quarks, e deu o nome à partícula.',
  d: 'Também criou o conceito de estranheza, em 1953 (Kazuhiko Nishijima chegou à mesma ideia de forma independente), e organizou as partículas no "Caminho Óctuplo". George Zweig propôs os quarks na mesma época, também de forma independente. O nome "quark" veio de uma frase do livro Finnegans Wake, de James Joyce. Recebeu o Nobel de 1969.' },
sci_emmy: { cat: 'people', t: 'Emmy Noether (1882–1935)', see: ['gauge', 'stab'],
  s: 'Matemática alemã que provou que cada simetria da natureza corresponde a uma lei de conservação.',
  d: 'O teorema de Noether, publicado em 1918, liga a simetria no tempo à conservação da energia, a simetria no espaço à conservação do momento e as simetrias internas às cargas conservadas. É uma das bases do Modelo Padrão. Ela também transformou a álgebra abstrata.' },
sci_cesar: { cat: 'people', t: 'César Lattes (1924–2005)', see: ['pion'],
  s: 'Físico curitibano, um dos descobridores do píon, em 1947. O quarto lugar padrão do jogo leva seu nome.',
  d: 'Com Giuseppe Occhialini e Cecil Powell, encontrou o píon em emulsões expostas a raios cósmicos; em 1948, com Eugene Gardner, detectou píons produzidos no acelerador de Berkeley. Foi um dos fundadores do CBPF, em 1949.' },
},
};

const ownCount = pi => Object.values(st.buildings).filter(b => b.owner === pi).length;
const roadCount = pi => Object.values(st.roads).filter(r => r.owner === pi).length;
const kindNames = v => [...new Set(st.board.vertices[v].hexes.map(h => st.board.hexes[h].kind).filter(E.isProd))].map(k => E.QN[k]);
const listPT = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
function bestVertex(opts) { let b = opts[0], bs = -1; for (const v of opts) { const sc = E.vertexScore(st, v); if (sc > bs) { bs = sc; b = v; } } return b; }
function bestEdge(edges) {
  let b = edges[0], bs = -1;
  for (const e of edges) {
    let sc = 0;
    for (const w of st.board.edges[e].v) if (E.distanceOK(st, w)) sc = Math.max(sc, E.vertexScore(st, w));
    if (sc > bs) { bs = sc; b = e; }
  }
  return b;
}
function diceFor(pi) {
  const nums = new Set();
  for (const [v, b] of Object.entries(st.buildings)) {
    if (b.owner !== pi) continue;
    for (const h of st.board.vertices[+v].hexes) { const H = st.board.hexes[h]; if (E.isProd(H.kind) && st.tokens.higgs !== h) nums.add(H.num); }
  }
  let best = 6, bp = -1;
  for (const n of nums) if (E.prob(n) > bp) { bp = E.prob(n); best = n; }
  const d1 = Math.min(6, best - 1);
  return [d1, best - d1];
}
function higgsTarget(opts) {
  let best = null, bs = -1;
  for (const h of opts) {
    const H = st.board.hexes[h];
    if (!E.isProd(H.kind)) continue;
    let mine = false, sc = 0;
    for (const v of H.verts) { const b = st.buildings[v]; if (!b) continue; if (b.owner === 0) mine = true; else if (E.qCount(st.players[b.owner]) > 0) sc += 1 + E.prob(H.num); }
    if (!mine && sc > bs) { bs = sc; best = h; }
  }
  if (best === null) best = opts.find(h => !st.board.hexes[h].verts.some(v => st.buildings[v] && st.buildings[v].owner === 0)) ?? opts[0];
  return best;
}
