<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HADRON</title>
<meta name="author" content="Apiano F. Morais, Job S. Furtado Neto e Ivan C. Jardim">
<meta name="description" content="HADRON: jogo de tabuleiro de física de partículas. Produza quarks, construa hádrons e núcleos atômicos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: jogo de tabuleiro de física de partículas, sério e vivo
   IDEA a placa fotográfica de uma câmara de bolhas (trilhas de partículas em espiral) ao lado do console de um detector
   PICTURE o tabuleiro hexagonal como corte do detector, peças dos jogadores nas intersecções, campos quânticos como fichas
   COLOUR fundo negro de câmara de bolhas; as cores dos quarks do GDD nos hexágonos; jogadores em branco, laranja, rosa e lima
   TYPE Space Grotesk para títulos e números + Inter para texto
   LAYOUT laptop: faixa de instrução, tabuleiro à esquerda, console do jogador à direita, placar e registro abaixo; celular: instrução fixa, tabuleiro, placar, console, registro */
:root{color-scheme:dark;--bg:#0a0d10;--plate:#0f1418;--panel:#141a1f;--panel2:#1a2127;--line:#28323a;--ink:#edf1f3;--mute:#9babb4;--u:#7cc4ff;--d:#3d72e6;--c:#3ec27f;--s:#f2c94c;--t:#ef5350;--b:#a979ec;--e:#f0a830;--hot:#ff6b5b;--focus:#9fd8ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.42}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto auto 1fr auto;grid-template-areas:"top top" "banner banner" "board panel" "side panel" "foot foot";gap:14px 18px;max-width:1440px;margin:0 auto;padding:10px max(16px,2vw) 40px}
.top{grid-area:top;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1}
.top h1 small{font:500 14px Inter,sans-serif;color:var(--mute);margin-left:10px;letter-spacing:0}
.top .sp{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:hover:not(:disabled){border-color:#4a5862;background:#212a31}
.btn.pri{background:var(--ink);color:#0a0d10;border-color:var(--ink)}
.btn.pri:hover:not(:disabled){background:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.banner{grid-area:banner;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:68px}
.banner .who{display:flex;align-items:center;gap:8px;font:700 17px "Space Grotesk",sans-serif}
.banner .msg{flex:1 1 260px;color:var(--ink)}
.banner .msg em{font-style:normal;color:var(--mute)}
.banner .opts{display:flex;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;vertical-align:-2px;width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #000;box-shadow:0 0 0 1px #ffffff33}
.dice{display:flex;gap:6px}
.dice svg{width:40px;height:40px}
.dice.roll svg{animation:tumble .5s ease-out both}
.dice.roll svg+svg{animation-delay:.07s}
@keyframes tumble{0%{transform:rotate(-35deg) scale(.6);opacity:.2}70%{transform:rotate(8deg) scale(1.06)}100%{transform:none}}
.boardcol{grid-area:board;display:flex;flex-direction:column;gap:10px}
.boardbox{scroll-margin-top:130px;position:relative;border-radius:18px;background:radial-gradient(120% 90% at 30% 20%,#141b20,#0b0f12 70%);border:1px solid var(--line);overflow:hidden}
.boardbox svg{display:block;width:100%;height:auto;max-height:calc(100svh - 150px);touch-action:manipulation}
.hit{cursor:pointer}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);padding:0 4px}
.legend b{color:var(--ink);font-weight:600}
.qd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--k);color:#0a0d10;font:italic 700 13px "Space Grotesk",sans-serif;vertical-align:-4px;margin-right:3px;flex:none}
.qd.e{font-style:normal}
.cost{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center;white-space:nowrap}
.panel{grid-area:panel;display:flex;flex-direction:column;gap:12px}
@media(min-width:981px){.panel{position:sticky;top:10px;align-self:start;max-height:calc(100svh - 20px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.me{display:flex;align-items:center;gap:10px}
.me h2{margin:0;flex:1;font-size:22px}
.me .vp{font:700 30px/1 "Space Grotesk",sans-serif}
.me .vp small{font-size:15px;color:var(--mute);font-weight:500}
.res{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.res div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 2px 4px;text-align:center}
.res .qd{width:24px;height:24px;font-size:15px;margin:0}
.res .n{display:block;font:700 19px/1.2 "Space Grotesk",sans-serif}
.res .lab{display:block;font-size:11px;color:var(--mute);white-space:nowrap}
.res .unst{border-color:#5a3b3b}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.sym{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px "Space Grotesk",sans-serif;background:var(--panel2);border:1px solid var(--line)}
.sym.t2{border-radius:9px}
.sym.t3{border-radius:4px;font-size:12px}
.brow .nm{font-weight:600}
.brow .nm small{color:var(--mute);font-weight:500}
.brow .why{display:block;font-size:12px;color:var(--mute)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{min-height:40px;min-width:44px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;gap:2px}
.seg button[aria-pressed=true]{border-color:var(--ink);background:#2a343c}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.trow span.l{font-size:13px;color:var(--mute);width:62px}
.hand{display:grid;gap:8px}
.ic{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.ic.basic{border-color:#2f4b66}.ic.protect{border-color:#365c45}.ic.reaction{border-color:#614a2b}
.ic .hd{display:flex;align-items:baseline;gap:8px}
.ic .hd b{flex:1}
.ic .g{font-size:12px;color:var(--mute)}
.ic p{margin:4px 0 8px;font-size:13px;color:#c9d3d8}
.ic .why{font-size:12px;color:var(--mute)}
.side{grid-area:side;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl.cur .pn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pl .pn{font-weight:700}
.pl .tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:500}
.pl .pv{font:700 26px/1 "Space Grotesk",sans-serif;text-align:right}
.pl .st{grid-column:2/4;font-size:13px;color:var(--mute)}
.badges{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:12px;border-radius:6px;padding:1px 7px;background:#232c33;color:#dfe7eb}
.log{max-height:340px;overflow:auto;font-size:13px;margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-top:1px solid #1f282e;display:flex;gap:8px}
.log li .t{color:var(--mute);font-variant-numeric:tabular-nums;width:2.2em;flex:none;text-align:right}
.log li .dot{width:10px;height:10px;margin-top:4px;border-width:1px}
.ov{position:fixed;inset:0;background:#05070acc;display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{width:min(640px,100%);max-height:calc(100svh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.modal.wide{width:min(900px,100%)}
.modal h2{margin:0 0 6px;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.modal h3{font-size:17px;margin:20px 0 8px}
.modal p{margin:6px 0;color:#d4dde1}
.modal .lead{color:var(--mute);margin-bottom:14px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0}
.prow input{min-height:44px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;width:100%}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:#0a0d10}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--k);min-width:2px}
.hist{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;margin-top:8px}
.hist>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.hist b{color:var(--ink)}
.hb{position:relative;height:120px;width:100%;border-bottom:1px solid var(--line)}
.hb i{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 0 0;background:#5d6b74}
.hb i.f{background:var(--hot)}
.hb s{position:absolute;left:-3px;right:-3px;border-top:2px dashed #e8eef1cc;height:0}
ol.interp{padding-left:20px;margin:6px 0}
ol.interp li{margin:6px 0;color:#d4dde1}
.step{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;flex:none}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.tgrid>div{display:flex;align-items:center;gap:6px;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.tgrid>div>span:first-child{white-space:nowrap}
.foot{grid-area:foot;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--mute);display:flex;gap:6px 16px;flex-wrap:wrap}
.foot b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#ffe3dc;color:#2a0c08;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 30px #0008}
@media(max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "banner" "board" "panel" "side" "foot"}
  .banner{position:sticky;top:0;z-index:6;box-shadow:0 8px 24px #000a}
  .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
  .boardbox svg{max-height:none}
}
@media(max-width:640px){
  .side{grid-template-columns:minmax(0,1fr)}
  .res{grid-template-columns:repeat(4,minmax(0,1fr))}
  .banner{padding:8px 10px;gap:8px}
  .banner .msg{flex-basis:100%;order:3;font-size:14px}
  .top h1 small,.top .long{display:none}
  .modal{padding:16px}
  .modal h2{font-size:24px}
}
@media(prefers-reduced-motion:reduce){.dice.roll svg,.pulse{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>HADRON <small id="sub">Física de partículas em 2d6</small></h1>
    <div class="sp"></div>
    <button class="btn ghost sm" id="bRules" type="button">Regras<span class="long"> e estatística</span></button>
    <button class="btn sm" id="bNew" type="button">Nova partida</button>
  </header>
  <section class="banner" id="banner" aria-live="polite"></section>
  <section class="boardcol">
    <div class="boardbox" id="board"></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="panel" id="panel"></aside>
  <section class="side">
    <div class="card"><h2>Placar</h2><div id="players"></div></div>
    <div class="card"><h2>Registro</h2><ul class="log" id="log"></ul></div>
  </section>
  <footer class="foot"><span><b>HADRON</b>, criado por Apiano F. Morais, Job S. Furtado Neto e Ivan C. Jardim.</span><span>Protótipo eletrônico do jogo de tabuleiro.</span></footer>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* HADRON — motor do jogo (lógica pura, sem DOM).
   Todo o estado é JSON simples: pode ser salvo e restaurado a qualquer momento. */
const HadronEngine = (() => {
'use strict';

// ---------------------------------------------------------------- constantes
const Q = ['u', 'd', 'c', 's', 't', 'b'];
const LIGHT = ['u', 'd'];
const QN = { u: 'Up', d: 'Down', c: 'Charm', s: 'Strange', t: 'Top', b: 'Bottom', e: 'Energia' };
const WIN = 12, HAND = 7, LONG_MIN = 5;
const LIMIT = { 1: 6, 2: 5, 3: 15 };
const FIELDS = ['decay', 'higgs', 'fusion'];
const FIELD_NAME = { decay: 'Campo de Decaimento', higgs: 'Campo de Higgs', fusion: 'Campo de Fusão' };
const TOKEN_SYM = { decay: 'W±', higgs: 'H⁰', fusion: 'g' };

// Distribuição definida na conversa: 16 hexágonos produtivos + 3 campos.
const TILE_SET = [
  { kind: 'u', num: 6 }, { kind: 'u', num: 8 }, { kind: 'u', num: 9 },
  { kind: 'd', num: 4 }, { kind: 'd', num: 6 }, { kind: 'd', num: 8 },
  { kind: 'c', num: 3 }, { kind: 'c', num: 5 }, { kind: 'c', num: 9 }, { kind: 'c', num: 10 },
  { kind: 's', num: 4 }, { kind: 's', num: 5 }, { kind: 's', num: 10 }, { kind: 's', num: 11 },
  { kind: 't', num: 11 }, { kind: 'b', num: 3 },
  { kind: 'decay', num: 2 }, { kind: 'higgs', num: 7 }, { kind: 'fusion', num: 12 },
];
const TILE_NAME = {
  u: 'Acelerador Linear', d: 'Acelerador Linear', c: 'Síncrotron', s: 'Colisor de Íons',
  t: 'Grande Colisor', b: 'Grande Colisor', decay: 'Campo de Decaimento', higgs: 'Campo de Higgs', fusion: 'Campo de Fusão',
};
const isProd = k => Q.includes(k);
const prob = n => (n >= 2 && n <= 12) ? (6 - Math.abs(7 - n)) / 36 : 0;

const BUILD = {
  proton:    { tier: 1, name: 'Próton', sym: 'p', cost: { u: 2, d: 1 }, vp: 1, baryon: true, text: 'Bárion uud. Produz 1 recurso por hexágono vizinho sorteado.' },
  neutron:   { tier: 1, name: 'Nêutron', sym: 'n', cost: { u: 1, d: 2 }, vp: 1, baryon: true, text: 'Bárion udd. Produz 1 recurso por hexágono vizinho sorteado.' },
  lambda:    { tier: 1, name: 'Lambda', sym: 'Λ', cost: { u: 1, d: 1, s: 1 }, vp: 1, baryon: true, text: 'Bárion uds. Pesca 1 carta ao ser construído e pode virar núcleo como um Próton (hipernúcleo).' },
  pion:      { tier: 1, name: 'Píon', sym: 'π', cost: { u: 1, d: 1, e: 2 }, vp: 1, meson: true, text: 'Méson u + anti-d. Suas trocas com o banco passam a ser 2:1.' },
  kaon:      { tier: 1, name: 'Káon', sym: 'K', cost: { u: 1, s: 1, e: 2 }, vp: 1, meson: true, text: 'Méson u + anti-s. Imune ao Campo de Higgs: não é bloqueado e você não pode ser roubado.' },
  deuterium: { tier: 2, name: 'Deutério', sym: '²H', vp: 2, from: ['proton', 'neutron', 'lambda'], text: 'Próton + nêutron. Evolui de um Próton, Nêutron ou Lambda seu; paga só o núcleon que falta. Produz 2.' },
  helium:    { tier: 2, name: 'Hélio-4', sym: '⁴He', cost: { u: 3, d: 3 }, vp: 2, from: ['deuterium'], text: 'Evolui de um Deutério (+1 próton +1 nêutron). Produz 2, +1 Energia por turno seu e 1 carta a cada 3 turnos.' },
  lithium:   { tier: 2, name: 'Lítio-7', sym: '⁷Li', cost: { u: 4, d: 5 }, vp: 2, from: ['helium'], text: 'Evolui de um Hélio-4 (+1 próton +2 nêutrons). Produz 2. Fusão Nuclear: 1 vez por turno, 1 Up + 1 Down → 1 Top ou 1 Bottom.' },
  carbon:    { tier: 2, name: 'Carbono-12', sym: '¹²C', cost: { e: 2 }, vp: 3, from: ['helium'], text: 'Evolui de um Hélio-4 (+2 Energias). Produz 2, imune a todos os campos; pesca 1 carta ao fim do seu turno se o dado não ativou campo.' },
  drift:     { tier: 3, name: 'Tubo de Deriva', sym: '', cost: { c: 1, s: 1 }, len: 1, text: 'Conexão básica entre construções.' },
  magnet:    { tier: 3, name: 'Ímã Supercondutor', sym: '', cost: { t: 1, e: 2 }, len: 2, text: 'Conexão resistente: vale 2 na maior cadeia e não pode ser aniquilada.' },
  detector:  { tier: 3, name: 'Detector', sym: '', cost: { b: 1, e: 1 }, len: 1, text: 'Conexão que pesca 1 carta ao ser construída.' },
};
const NUCLEI = ['deuterium', 'helium', 'lithium', 'carbon'];

const CARDS = {
  forte:       { name: 'Força Nuclear Forte', group: 'basic', n: 3, text: 'O próximo bárion (Próton, Nêutron ou Lambda) que você construir neste turno custa 1 Up a menos.' },
  fraca:       { name: 'Força Nuclear Fraca', group: 'basic', n: 3, text: 'Decaimento controlado: descarte 1 quark à sua escolha e ganhe 2 Energias.' },
  em:          { name: 'Força Eletromagnética', group: 'basic', n: 3, text: 'Mova um dos três Campos Quânticos para qualquer hexágono (sem roubo).' },
  gravidade:   { name: 'Gravidade', group: 'basic', n: 3, text: 'Escolha uma construção sua: receba 1 quark de cada hexágono produtivo vizinho a ela.' },
  gauge:       { name: 'Simetria Gauge', group: 'protect', n: 2, text: 'Uma construção sua fica imune a campos e cartas de ataque até o seu próximo turno.' },
  blindagem:   { name: 'Blindagem Nuclear', group: 'protect', n: 2, text: 'Seus recursos não podem ser roubados nem fundidos até o seu próximo turno.' },
  estab:       { name: 'Estabilização Quântica', group: 'protect', n: 2, text: 'Reação: quando um campo ativado pelos dados atingir você, cancele o efeito. Usada fora do seu turno.' },
  unificada:   { name: 'Força Unificada', group: 'protect', n: 2, text: 'Mova qualquer Campo Quântico para onde quiser. Se for o de Higgs, roube 1 quark como num 7.' },
  fusao:       { name: 'Fusão Nuclear', group: 'reaction', n: 2, cost: { e: 1 }, text: 'Custa 1 Energia. Com dois Deutérios seus, um vira Hélio-4 e o outro volta ao hádron de origem.' },
  fissao:      { name: 'Fissão Nuclear', group: 'reaction', n: 2, cost: { e: 1 }, text: 'Custa 1 Energia. Um Hélio-4 ou Lítio-7 de oponente volta a ser Deutério; os vizinhos dele ganham 1 quark leve cada.' },
  aniquilacao: { name: 'Aniquilação', group: 'reaction', n: 2, text: 'Pague um par partícula/antipartícula (2 quarks iguais + 2 Energias): remova um hádron simples ou um Tubo/Detector de oponente e pesque 1 carta.' },
  descoberta:  { name: 'Descoberta Científica', group: 'reaction', n: 2, cost: { e: 1 }, text: 'Custa 1 Energia. Pesque 2 cartas.' },
  colaboracao: { name: 'Colaboração Acadêmica', group: 'reaction', n: 2, cost: { e: 1 }, text: 'Custa 1 Energia. Troque 1 carta aleatória sua por 1 carta aleatória de um oponente.' },
  nobel:       { name: 'Prêmio Nobel', group: 'point', n: 2, text: '1 ponto de estabilidade. Revelada assim que é pescada.' },

  while (d.stage < 2) { const victim = d.stage === 0 ? d.a : d.b; d.stage++; if (askReact(st, victim, d)) return; }
  applyFusion(st, d.a, d.b);
}
function applyFusion(st, a, b) {
  const A = st.players[a], B = st.players[b];
  if (A.blind || B.blind) { log(st, 'A Blindagem Nuclear impediu a fusão.'); return; }
  if (qCount(A) < 2 || qCount(B) < 2) { log(st, `Fusão falhou: ${A.name} e ${B.name} precisam de 2 quarks cada.`); return; }
  for (const i of [a, b]) for (let k = 0; k < 2; k++) loseRandom(st, i);
  A.collab++; B.collab++;
  log(st, `${A.name} e ${B.name} fundem 2 quarks cada num Núcleo Colaborativo: +1 ponto para cada.`);
}
function endTurn(st) {
  const pi = st.current, p = st.players[pi], s = st.dice[0] + st.dice[1];
  if (owns(st, pi, 'carbon') && ![2, 7, 12].includes(s)) { log(st, `Carbono-12 estável: ${p.name} pesca 1 carta.`, pi); drawCards(st, pi, 1); }
  for (const q of st.players) {
    const t = q.res.t, b = q.res.b;
    if (!t && !b) continue;
    q.res.c += t; q.res.s += b; q.res.e += t + b; q.res.t = 0; q.res.b = 0;
    const parts = []; if (t) parts.push(`${t} Top → Charm`); if (b) parts.push(`${b} Bottom → Strange`);
    log(st, `Decaimento de ${q.name}: ${parts.join(', ')}, +${t + b} Energia.`);
  }
  if (p.cards.length > HAND) return askDiscard(st);
  nextTurn(st);
}
function askDiscard(st) {
  const p = st.players[st.current];
  st.pending = { who: st.current, kind: 'discard', pick: 'card', options: [...new Set(p.cards)], prompt: `Limite de ${HAND} cartas: descarte mais ${p.cards.length - HAND}.` };
}
function nextTurn(st) { st.pending = null; st.current = (st.current + 1) % st.players.length; startTurn(st); }

function playCard(st, id) {
  const pi = st.current, p = st.players[pi];
  if (!cardPlayable(st, pi, id)) throw new Error(whyNotCard(st, pi, id));
  p.cards.splice(p.cards.indexOf(id), 1); st.discard.push(id); st.flags.cardPlayed = true;
  if (CARDS[id].cost) p.res.e -= CARDS[id].cost.e;
  log(st, `${p.name} joga ${CARDS[id].name}.`, pi);
  const pend = (kind, pick, options, prompt, data) => { st.pending = { who: pi, kind, pick, options, prompt, data: data || {} }; };
  switch (id) {
    case 'forte': st.flags.discount = true; break;
    case 'fraca': pend('fraca', 'res', Q.filter(k => p.res[k] > 0), 'Escolha o quark que decai em 2 Energias.'); break;
    case 'em': case 'unificada': pend('tokenPick', 'token', FIELDS.slice(), 'Escolha o Campo Quântico que vai mover.', { card: id }); break;
    case 'gravidade': pend('gravity', 'vertex', gravityOptions(st, pi), 'Escolha a construção sua que atrai os recursos vizinhos.'); break;
    case 'gauge': pend('gauge', 'vertex', ownVerts(st, pi), 'Escolha a construção que fica protegida até o seu próximo turno.'); break;
    case 'blindagem': p.blind = true; log(st, `Os recursos de ${p.name} estão protegidos até o próximo turno dele.`, pi); break;
    case 'fusao': pend('fusao1', 'vertex', ownOfType(st, pi, 'deuterium'), 'Escolha o Deutério que vira Hélio-4.'); break;
    case 'fissao': pend('fissao', 'vertex', fissionOptions(st, pi), 'Escolha o núcleo pesado que sofre fissão.'); break;
    case 'aniquilacao': pend('aniqRes', 'res', Q.filter(k => p.res[k] >= 2), 'Escolha o par partícula/antipartícula: 2 quarks iguais (mais 2 Energias).'); break;
    case 'descoberta': drawCards(st, pi, 2); break;
    case 'colaboracao': pend('colab', 'player', others(st, pi).filter(i => st.players[i].cards.length), 'Escolha com quem trocar uma carta.'); break;
  }
}

function pick(st, val) {
  const pd = st.pending;
  if (!pd) throw new Error('Não há nada para escolher agora.');
  if (!pd.options.some(o => same(o, val))) throw new Error('Escolha inválida.');
  const pi = pd.who, p = st.players[pi], d = pd.data || {};
  st.pending = null;
  const pend = (kind, pick2, options, prompt, data) => { st.pending = { who: pi, kind, pick: pick2, options, prompt, data: data || {} }; };
  switch (pd.kind) {
    case 'setupHadron':
      st.buildings[val] = { owner: pi, type: d.type };
      log(st, `${p.name} posiciona um ${BUILD[d.type].name}.`, pi);
      pend('setupAccel', 'edge', st.board.vertices[val].edges.filter(e => !st.roads[e]), `Posicione um Tubo de Deriva grátis ligado ao seu ${BUILD[d.type].name}.`, { v: val });
      break;
    case 'setupAccel': {
      st.roads[val] = { owner: pi, type: 'drift' };
      const n = st.players.length;
      if (st.setupStep >= n) {
        const g = {};
        for (const h of st.board.vertices[d.v].hexes) {
          let k = st.board.hexes[h].kind;
          if (!isProd(k)) continue;
          if (k === 't' || k === 'b') { const to = k === 't' ? 'c' : 's'; p.res[to]++; p.res.e++; g[to] = (g[to] || 0) + 1; g.e = (g.e || 0) + 1; continue; }
          p.res[k]++; g[k] = (g[k] || 0) + 1;
        }
        log(st, `${p.name} recebe os recursos iniciais: ${fmtRes(g)}.`, pi);
      }
      st.setupStep++;
      updateLongest(st);
      if (st.setupStep < 2 * n) beginSetupStep(st);
      else { st.phase = 'play'; st.current = 0; log(st, 'Preparação concluída. Que comecem as colisões!'); startTurn(st); }
      break;
    }
    case 'higgsHex': afterHiggsHex(st, val, d.viaCard); break;
    case 'higgsSteal': targetSteal(st, val, d.viaCard); break;
    case 'react':
      if (val) { p.cards.splice(p.cards.indexOf('estab'), 1); st.discard.push('estab'); log(st, `${p.name} usa Estabilização Quântica e cancela o ${FIELD_NAME[d.field]}!`, pi); }
      else if (d.field === 'fusion') continueFusion(st, d);
      else applyField(st, d);
      break;
    case 'decayPick': {
      const owner = st.buildings[val].owner;
      if (!askReact(st, owner, { field: 'decay', v: val })) applyField(st, { field: 'decay', v: val });
      break;
    }
    case 'fusionPick1': pend('fusionPick2', 'player', others(st, pi).filter(i => i !== val), 'Escolha o segundo jogador da fusão.', { a: val }); break;
    case 'fusionPick2': continueFusion(st, { field: 'fusion', a: d.a, b: val, stage: 0 }); break;
    case 'fraca': p.res[val]--; p.res.e += 2; log(st, `${p.name} converte 1 ${QN[val]} em 2 Energias.`, pi); break;
    case 'tokenPick': pend('tokenHex', 'hex', st.board.hexes.map(h => h.id).filter(h => h !== st.tokens[val]), `Escolha o destino do ${FIELD_NAME[val]}.`, { card: d.card, token: val }); break;
    case 'tokenHex':
      if (d.card === 'unificada' && d.token === 'higgs') afterHiggsHex(st, val, true);
      else { moveToken(st, d.token, val); log(st, `${p.name} move o ${FIELD_NAME[d.token]}.`, pi); }
      break;
    case 'gravity': {
      const g = {};
      for (const h of gravityHexes(st, val)) { const k = st.board.hexes[h].kind; p.res[k]++; g[k] = (g[k] || 0) + 1; }
      log(st, `Gravidade: ${p.name} atrai ${fmtRes(g)}.`, pi);
      break;
    }
    case 'gauge': st.buildings[val].shield = true; log(st, `O ${BUILD[st.buildings[val].type].name} de ${p.name} está protegido por Simetria Gauge.`, pi); break;
    case 'fusao1': pend('fusao2', 'vertex', ownOfType(st, pi, 'deuterium').filter(v => v !== val), 'Escolha o outro Deutério, que volta ao hádron de origem.', { v1: val }); break;
    case 'fusao2': {
      const b1 = st.buildings[d.v1], b2 = st.buildings[val];
      b1.type = 'helium'; b1.heCount = 0; b2.type = b2.base || 'proton';
      log(st, `${p.name} funde dois Deutérios: nasce um Hélio-4.`, pi);
      break;
    }
    case 'fissao': stepDown(st, val, 'sofre fissão', 'deuterium'); break;
    case 'aniqRes': pend('aniqTarget', 'target', annihilationTargets(st, pi), 'Escolha a construção do oponente que será aniquilada.', { q: val }); break;
    case 'aniqTarget': {
      p.res[d.q] -= 2; p.res.e -= 2;
      if (val.k === 'v') { const b = st.buildings[val.id]; log(st, `${p.name} aniquila o ${BUILD[b.type].name} de ${pn(st, b.owner)}.`, pi); delete st.buildings[val.id]; }
      else { const r = st.roads[val.id]; log(st, `${p.name} aniquila um ${BUILD[r.type].name} de ${pn(st, r.owner)}.`, pi); delete st.roads[val.id]; }
      drawCards(st, pi, 1);
      updateLongest(st);
      break;
    }
    case 'colab': {
      const q = st.players[val];
      const mine = p.cards.length ? p.cards.splice(ri(st, p.cards.length), 1)[0] : null;
      const theirs = q.cards.splice(ri(st, q.cards.length), 1)[0];
      p.cards.push(theirs); if (mine) q.cards.push(mine);
      log(st, `${p.name} e ${q.name} trocam cartas.`, pi);
      break;
    }
    case 'tradeResponse': {
      const from = st.players[d.from];
      if (!val) { log(st, `${p.name} recusa a troca.`, pi); break; }
      if (!hasRes(from, d.give) || !hasRes(p, d.get)) { log(st, 'Troca cancelada: faltam recursos.'); break; }
      addRes(from, d.give, -1); addRes(p, d.give); addRes(p, d.get, -1); addRes(from, d.get);
      log(st, `${p.name} aceita: recebe ${fmtRes(d.give)} e entrega ${fmtRes(d.get)} a ${from.name}.`, pi);
      break;
    }
    case 'discard':
      p.cards.splice(p.cards.indexOf(val), 1); st.discard.push(val);
      if (p.cards.length > HAND) askDiscard(st); else nextTurn(st);
      break;
    default: throw new Error('Escolha desconhecida: ' + pd.kind);
  }
}

function cleanRes(r) {
  const out = {};
  for (const [k, v] of Object.entries(r || {})) {
    if (!(k in QN)) throw new Error('Recurso inválido.');
    const n = Math.floor(+v);
    if (n < 0) throw new Error('Quantidade inválida.');
    if (n > 0) out[k] = n;
  }
  return out;
}

function apply(st, a) {
  if (st.phase === 'over') throw new Error('A partida terminou.');
  const pi = st.current, p = st.players[pi];
  const main = () => {
    if (st.phase !== 'play') throw new Error('Termine a preparação primeiro.');
    if (st.pending) throw new Error('Resolva a escolha pendente primeiro.');
    if (!st.rolled) throw new Error('Role os dados primeiro.');
  };
  switch (a.type) {
    case 'pick': pick(st, a.value); break;
    case 'roll':
      if (st.phase !== 'play' || st.pending || st.rolled) throw new Error('Não é hora de rolar os dados.');
      doRoll(st, a.dice); break;
    case 'build': {
      main();
      const kind = a.kind, B = BUILD[kind];
      if (!B) throw new Error('Construção desconhecida.');
      if (!buildSpots(st, pi, kind).includes(a.at)) throw new Error('Posição inválida para ' + B.name + '.');
      const cost = costOf(st, pi, kind, a.at), plan = payPlan(p, cost);
      if (!plan.ok) throw new Error('Recursos insuficientes.');
      pay(p, cost, plan);
      if (B.tier === 3) st.roads[a.at] = { owner: pi, type: kind };
      else if (B.tier === 1) st.buildings[a.at] = { owner: pi, type: kind };
      else { const b = st.buildings[a.at]; if (kind === 'deuterium') b.base = b.type; b.type = kind; b.heCount = 0; }
      if (B.baryon && st.flags.discount) st.flags.discount = false;
      log(st, `${p.name} constrói ${B.tier === 2 ? 'um núcleo de ' : ''}${B.name}${plan.useE ? ` (1 Energia no lugar de 1 ${QN[plan.useE]})` : ''}.`, pi);
      if (kind === 'lambda' || kind === 'detector') drawCards(st, pi, 1);
      updateLongest(st);
      break;
    }
    case 'bank': {
      main();
      const r = bankRatio(st, pi);
      if (!Q.includes(a.give) || !Q.includes(a.get) || a.give === a.get) throw new Error('Troca inválida.');
      if (p.res[a.give] < r) throw new Error(`Precisa de ${r} ${QN[a.give]}.`);
      p.res[a.give] -= r; p.res[a.get]++;
      log(st, `${p.name} troca ${r} ${QN[a.give]} por 1 ${QN[a.get]} com o banco.`, pi);
      break;
    }
    case 'energy':
      main();
      if (!Q.includes(a.get)) throw new Error('Troca inválida.');
      if (p.res.e < 3) throw new Error('Precisa de 3 Energias.');
      p.res.e -= 3; p.res[a.get]++;
      log(st, `${p.name} converte 3 Energias em 1 ${QN[a.get]}.`, pi);
      break;
    case 'li':
      main();
      if (!owns(st, pi, 'lithium')) throw new Error('Precisa de um Lítio-7.');
      if (st.flags.liUsed) throw new Error('A Fusão do Lítio-7 já foi usada neste turno.');
      if (a.get !== 't' && a.get !== 'b') throw new Error('Escolha Top ou Bottom.');
      if (p.res.u < 1 || p.res.d < 1) throw new Error('Precisa de 1 Up e 1 Down.');
      p.res.u--; p.res.d--; p.res[a.get]++; st.flags.liUsed = true;
      log(st, `Lítio-7: ${p.name} funde 1 Up + 1 Down em 1 ${QN[a.get]}.`, pi);
      break;
    case 'offer': {
      main();
      const to = a.to, give = cleanRes(a.give), get = cleanRes(a.get);
      if (!(to >= 0 && to < st.players.length) || to === pi) throw new Error('Escolha outro jogador.');
      if (!Object.keys(give).length || !Object.keys(get).length) throw new Error('A troca precisa ter algo dos dois lados.');
      if (!hasRes(p, give)) throw new Error('Você não tem esses recursos.');
      st.flags.offers++;
      const can = hasRes(st.players[to], get);
      st.pending = { who: to, kind: 'tradeResponse', pick: 'yesno', options: can ? [true, false] : [false], data: { from: pi, give, get },
        prompt: `${p.name} oferece ${fmtRes(give)} em troca de ${fmtRes(get)}.${can ? '' : ' (Você não tem o que foi pedido.)'}` };
      log(st, `${p.name} propõe uma troca a ${st.players[to].name}.`, pi);
      break;
    }
    case 'card': main(); playCard(st, a.id); break;
    case 'unify':
      main();
      if (!canUnify(st, pi)) throw new Error('Você precisa das 4 cartas básicas de força ao mesmo tempo.');
      for (const c of UNI) { p.cards.splice(p.cards.indexOf(c), 1); st.discard.push(c); }
      p.unified = true;
      log(st, `${p.name} completa o experimento Unificação das Forças: +2 pontos.`, pi);
      break;
    case 'end': main(); endTurn(st); break;
    default: throw new Error('Ação desconhecida.');
  }
  checkWin(st);
  return st;
}

// ---------------------------------------------------------------- ações legais (para bots e testes)
function legal(st) {
  if (st.phase === 'over') return [];
  if (st.pending) return st.pending.options.map(o => ({ type: 'pick', value: o }));
  if (!st.rolled) return [{ type: 'roll' }];
  const pi = st.current, p = st.players[pi], acts = [];
  for (const kind of Object.keys(BUILD)) for (const at of buildSpots(st, pi, kind)) if (payPlan(p, costOf(st, pi, kind, at)).ok) acts.push({ type: 'build', kind, at });
  const r = bankRatio(st, pi);
  for (const g of Q) if (p.res[g] >= r) for (const k of Q) if (k !== g) acts.push({ type: 'bank', give: g, get: k });
  if (p.res.e >= 3) for (const k of Q) acts.push({ type: 'energy', get: k });
  if (owns(st, pi, 'lithium') && !st.flags.liUsed && p.res.u && p.res.d) acts.push({ type: 'li', get: 't' }, { type: 'li', get: 'b' });
  for (const id of new Set(p.cards)) if (cardPlayable(st, pi, id)) acts.push({ type: 'card', id });
  if (canUnify(st, pi)) acts.push({ type: 'unify' });
  acts.push({ type: 'end' });
  return acts;
}

// ---------------------------------------------------------------- computador
const KIND_W = { u: 1.25, d: 1.2, c: 0.8, s: 0.9, t: 0.45, b: 0.45 };
function vertexScore(st, v) {
  return st.board.vertices[v].hexes.reduce((s, h) => { const H = st.board.hexes[h]; return s + (isProd(H.kind) ? prob(H.num) * KIND_W[H.kind] : 0); }, 0);
}
function leader(st, list) { let best = list[0], bv = -1; for (const i of list) { const v = vp(st, i); if (v > bv) { bv = v; best = i; } } return best; }
function botPick(st, pd) {
  const pi = pd.who, opts = pd.options, p = st.players[pi];
  const anyOf = () => opts[ri(st, opts.length)];
  switch (pd.kind) {
    case 'setupHadron': {
      let best = opts[0], bs = -1;
      for (const v of opts) { const s = vertexScore(st, v) + rnd(st) * 0.02; if (s > bs) { bs = s; best = v; } }
      return best;
    }
    case 'higgsHex': case 'tokenHex': {
      if (pd.kind === 'tokenHex' && pd.data.token !== 'higgs') return anyOf();
      let best = opts[0], bs = -Infinity;
      for (const h of opts) {
        const H = st.board.hexes[h]; let s = isProd(H.kind) ? 0 : -5;
        for (const v of H.verts) { const b = st.buildings[v]; if (!b) continue; s += (b.owner === pi ? -3 : 1 + vp(st, b.owner) * 0.1) * (BUILD[b.type].tier === 2 ? 2 : 1); }
        s = s * (prob(H.num) + 0.02) + rnd(st) * 0.01;
        if (s > bs) { bs = s; best = h; }
      }
      return best;
    }
    case 'higgsSteal': case 'fusionPick1': case 'fusionPick2': case 'colab': return leader(st, opts);
    case 'decayPick': case 'fissao': return opts.reduce((a, v) => vp(st, st.buildings[v].owner) > vp(st, st.buildings[a].owner) ? v : a, opts[0]);
    case 'aniqTarget': {
      const vs = opts.filter(o => o.k === 'v');
      const pool = vs.length ? vs : opts;
      return pool[ri(st, pool.length)];
    }
    case 'react': return true;
    case 'tradeResponse': return opts.includes(true) && rnd(st) < 0.5;
    case 'fraca': case 'aniqRes': return opts.reduce((a, k) => (p.res[k] > p.res[a] ? k : a), opts[0]);
    case 'tokenPick': return 'higgs';
    case 'gravity': return opts.reduce((a, v) => gravityHexes(st, v).length > gravityHexes(st, a).length ? v : a, opts[0]);
    case 'gauge': return opts.reduce((a, v) => BUILD[st.buildings[v].type].tier > BUILD[st.buildings[a].type].tier ? v : a, opts[0]);
    case 'discard': {
      const order = ['colaboracao', 'gauge', 'em', 'blindagem', 'fissao', 'aniquilacao', 'fusao', 'descoberta', 'unificada', 'estab', 'forte', 'fraca', 'gravidade'];
      return order.find(c => opts.includes(c)) || anyOf();
    }
    default: return anyOf();
  }
}
function bestRoad(st, pi, spots) {
  let best = spots[0], bs = -1;
  for (const e of spots) {
    let s = rnd(st) * 0.05;
    for (const v of st.board.edges[e].v) if (distanceOK(st, v)) s += vertexScore(st, v);
    if (s > bs) { bs = s; best = e; }
  }
  return best;
}
function botAction(st) {
  if (st.pending) return { type: 'pick', value: botPick(st, st.pending) };
  if (!st.rolled) return { type: 'roll' };
  const pi = st.current, p = st.players[pi];
  if (canUnify(st, pi)) return { type: 'unify' };
  const t1Free = buildSpots(st, pi, 'proton').length;
  const order = ['carbon', 'helium', 'deuterium', 'proton', 'neutron', 'lambda', 'kaon', 'pion', 'lithium', 'magnet', 'detector', 'drift'];
  for (const kind of order) {
    const spots = buildSpots(st, pi, kind).filter(at => payPlan(p, costOf(st, pi, kind, at)).ok);
    if (!spots.length) continue;
    const B = BUILD[kind];
    if (B.tier === 3) {
      if (t1Free > 0 && kind === 'drift' && countTier(st, pi, 3) > 6) continue;
      return { type: 'build', kind, at: bestRoad(st, pi, spots) };
    }
    if (B.tier === 1) { let best = spots[0]; for (const v of spots) if (vertexScore(st, v) > vertexScore(st, best)) best = v; return { type: 'build', kind, at: best }; }
    return { type: 'build', kind, at: spots[0] };
  }
  if (!st.flags.cardPlayed) {
    const playable = [...new Set(p.cards)].filter(id => cardPlayable(st, pi, id));
    if (playable.length && rnd(st) < 0.7) return { type: 'card', id: playable[ri(st, playable.length)] };
  }
  if (owns(st, pi, 'lithium') && !st.flags.liUsed && p.res.u >= 2 && p.res.d >= 2 && p.res.e >= 2) return { type: 'li', get: 't' };
  if (st.flags.botTrades < 3) {
    const want = p.res.u <= p.res.d ? 'u' : 'd';
    if (p.res.e >= 5) { st.flags.botTrades++; return { type: 'energy', get: want }; }
    const r = bankRatio(st, pi);
    const give = [...Q].sort((a, b) => p.res[b] - p.res[a]).find(k => k !== want && p.res[k] >= r + (LIGHT.includes(k) ? 2 : 0));
    if (give) { st.flags.botTrades++; return { type: 'bank', give, get: want }; }
  }
  if (st.flags.offers < 1 && rnd(st) < 0.2) {
    const to = others(st, pi)[ri(st, st.players.length - 1)];
    const mine = [...Q].sort((a, b) => p.res[b] - p.res[a])[0];
    const theirs = LIGHT.find(k => st.players[to].res[k] > 0 && k !== mine);
    if (p.res[mine] > 0 && theirs) return { type: 'offer', to, give: { [mine]: 1 }, get: { [theirs]: 1 } };
  }
  return { type: 'end' };
}

function tileStats() {
  const out = {};
  for (const k of Q) {
    const nums = TILE_SET.filter(t => t.kind === k).map(t => t.num);
    out[k] = { nums, p: nums.reduce((s, n) => s + prob(n), 0) };
  }
  return out;

  if (st.phase === 'setup') h += '<p class="note">Preparação: cada jogador posiciona um Próton e depois um Nêutron, cada um com um Tubo de Deriva, sem custo. Os recursos iniciais vêm dos hexágonos do Nêutron.</p>';
  else if (p.bot) h += '<p class="note">O computador está jogando este turno.</p>';
  else if (st.flags.discount) h += '<p class="note">Força Nuclear Forte ativa: o próximo bárion custa 1 Up a menos.</p>';
  if (p.blind) h += '<p class="note">Blindagem Nuclear ativa até o seu próximo turno.</p>';
  h += '</div>';

  h += '<div class="card"><h2>Construir</h2><h3>Hádrons (como aldeias)</h3>' + ['proton', 'neutron', 'lambda', 'pion', 'kaon'].map(k => buildRow(k, canAct)).join('');
  h += '<h3>Núcleos (evoluem no mesmo lugar)</h3>' + ['deuterium', 'helium', 'lithium', 'carbon'].map(k => buildRow(k, canAct)).join('');
  h += '<h3>Aceleradores (conexões)</h3>' + ['drift', 'magnet', 'detector'].map(k => buildRow(k, canAct)).join('') + '</div>';

  const r = E.bankRatio(st, pi);
  h += `<div class="card"><h2>Trocar</h2><h3>Banco ${r}:1${r === 2 ? ' (Píon)' : ''}</h3>`;
  h += `<div class="trow"><span class="l">Dar ${r}</span><div class="seg">${E.Q.map(k => `<button type="button" data-bg="${k}" aria-pressed="${ui.bankGive === k}" ${!canAct || p.res[k] < r ? 'disabled' : ''}>${qd(k)}</button>`).join('')}</div></div>`;
  h += `<div class="trow"><span class="l">Receber 1</span><div class="seg">${E.Q.map(k => `<button type="button" data-bt="${k}" aria-pressed="${ui.bankGet === k}" ${!canAct ? 'disabled' : ''}>${qd(k)}</button>`).join('')}</div></div>`;
  const bankOk = canAct && ui.bankGive && ui.bankGet && ui.bankGive !== ui.bankGet && p.res[ui.bankGive] >= r;
  h += `<button class="btn sm" type="button" data-a="bank" ${bankOk ? '' : 'disabled'}>Trocar com o banco</button>`;
  h += `<h3>Energia 3:1</h3><div class="trow"><span class="l">3 ${qd('e')}→</span><div class="seg">${E.Q.map(k => `<button type="button" data-en="${k}" ${!canAct || p.res.e < 3 ? 'disabled' : ''}>${qd(k)}</button>`).join('')}</div></div>`;
  if (E.owns(st, pi, 'lithium')) {
    const liOk = canAct && !st.flags.liUsed && p.res.u >= 1 && p.res.d >= 1;
    h += `<h3>Fusão do Lítio-7 (1 por turno)</h3><div class="trow"><span class="l">${qd('u')}+${qd('d')}→</span><div class="seg"><button type="button" data-li="t" ${liOk ? '' : 'disabled'}>${qd('t')} Top</button><button type="button" data-li="b" ${liOk ? '' : 'disabled'}>${qd('b')} Bottom</button></div></div>`;
  }
  h += `<h3>Com outro jogador</h3><button class="btn sm" type="button" data-a="trade" ${canAct ? '' : 'disabled'}>Propor troca…</button></div>`;

  const uniq = [...new Set(p.cards)];
  h += `<div class="card"><h2>Cartas de Interação <small class="num" style="color:var(--mute);font-weight:500">${p.cards.length}/${E.HAND}</small></h2>`;
  if (E.canUnify(st, pi)) h += `<p class="note">Você tem as 4 forças básicas.</p><button class="btn pri sm" type="button" data-a="unify" ${canAct ? '' : 'disabled'}>Unificação das Forças (+2 pontos)</button>`;
  h += '<div class="hand">' + (uniq.length ? uniq.map(id => {
    const C = E.CARDS[id], n = p.cards.filter(c => c === id).length;
    const playable = canAct && E.cardPlayable(st, pi, id);
    const why = !playable && canAct ? E.whyNotCard(st, pi, id) : '';
    return `<div class="ic ${C.group}"><div class="hd"><b>${esc(C.name)}${n > 1 ? ' ×' + n : ''}</b><span class="g">${GROUP[C.group]}</span></div><p>${esc(C.text)}</p>${id === 'estab' ? '<span class="why">Guardada para reagir a campos.</span>' : `<button class="btn sm" type="button" data-card="${id}" ${playable ? '' : 'disabled'}>Jogar</button> <span class="why">${esc(why)}</span>`}</div>`;
  }).join('') : '<p class="note">Sem cartas na mão.</p>') + '</div>';
  if (p.points.length) h += `<h3>Conquistas</h3><p class="note">${p.points.map(c => esc(E.CARDS[c].name)).join(', ')} (+${p.points.length})</p>`;
  h += '</div>';
  el.innerHTML = h;
}

    <li>Lambda: a "habilidade especial" virou pescar 1 carta e poder virar núcleo como um Próton. Lítio-7: "combina hádrons" virou 1 Up + 1 Down → 1 Top ou Bottom por turno. Píon: banco 2:1 para qualquer quark.</li>

    <p class="note">As porcentagens somam mais de 100% porque números são compartilhados: um 6 produz Up e Down ao mesmo tempo.</p>
    <h3>Rolagens desta partida (${total})</h3><p class="note">Barras: vezes que cada soma saiu. Traço: o esperado para ${total} rolagens. Em vermelho, os campos.</p><div class="hist">${hist}</div>`;
  }
  return `<div class="modal wide" role="dialog" aria-label="Regras"><h2>Regras do protótipo</h2><p class="lead">HADRON, criado por Apiano F. Morais, Job S. Furtado Neto e Ivan C. Jardim.</p><div class="tabs" role="tablist">${tab('regras', 'Regras')}${tab('escolhas', 'Escolhas de design')}${tab('stats', 'Estatística')}</div>${body}<div class="mfoot"><button class="btn pri" type="button" data-a="close">Fechar</button></div></div>`;

function openModal(name) { ui.modal = name; renderModal(); }

// ------------------------------------------------------------ ciclo
function render() {
  if (!st) return;
  if (st.phase === 'over' && !ui.overShown && !st.demo) { ui.overShown = true; ui.modal = 'over'; renderModal(); }
  if (ui.mode && (st.pending || !humanTurn())) ui.mode = null;
  $('#sub').textContent = st.phase === 'setup' ? 'Preparação' : `Rodada ${Math.max(1, Math.ceil(st.turn / st.players.length))}`;
  renderBanner(); renderBoard(); renderPanel(); renderPlayers(); renderLog();
  scheduleBot();
}
function scheduleBot() {
  clearTimeout(botTimer);
  if (!st || st.phase === 'over' || !st.players[actor()].bot) return;
  if (st.demo && st.phase === 'over') return;
  botTimer = setTimeout(() => {
    if (!st || st.phase === 'over' || !st.players[actor()].bot) return;
    try { E.apply(st, E.botAction(st)); }
    catch (e) { try { E.apply(st, st.pending ? { type: 'pick', value: st.pending.options[0] } : { type: 'end' }); } catch (e2) { toast('O computador travou: ' + e2.message); return; } }
    save(); render();
  }, st.demo ? 700 : 650);
}
function startGame(players) {
  st = E.newGame({ players });
  ui.mode = null; ui.overShown = false; ui.bankGive = ui.bankGet = null; ui.lastDice = '';
  ui.modal = null; renderModal(); save(); render();
}
function demoGame(seed = 8128) {
  const g = E.newGame({ players: DEFAULT_NAMES.slice(0, 3).map((name, i) => ({ name, color: PCOL[i], bot: true })), seed });
  g.demo = true;
  let guard = 0;
  while (g.phase !== 'over' && g.turn < 26 && guard++ < 5000) E.apply(g, E.botAction(g));
  if (g.phase === 'over') return demoGame(seed + 1);
  return g;
}

// ------------------------------------------------------------ eventos
function onClick(ev) {
  const t = ev.target.closest('[data-a],[data-pick],[data-build],[data-bg],[data-bt],[data-en],[data-li],[data-card],[data-pn],[data-ptype],[data-tab],[data-tr],[data-tto],[data-v],[data-e],[data-h]');
  if (!t) return;
  const d = t.dataset;
  if (d.a === 'ovclose' && ev.target !== t) return;
  if (d.v !== undefined || d.e !== undefined || d.h !== undefined) return boardPick(d);
  if (d.pick !== undefined) return act({ type: 'pick', value: JSON.parse(d.pick) });
  if (d.build) {
    const pi = st.current, p = st.players[pi];
    const spots = E.buildSpots(st, pi, d.build).filter(at => E.payPlan(p, E.costOf(st, pi, d.build, at)).ok);
    ui.mode = { kind: 'place', build: d.build, spots };
    render();
    $('#board').scrollIntoView({ block: matchMedia('(max-width:980px)').matches ? 'start' : 'nearest', behavior: 'smooth' });
    return;
  }
  if (d.bg) { ui.bankGive = d.bg; return render(); }
  if (d.bt) { ui.bankGet = d.bt; return render(); }
  if (d.en) return act({ type: 'energy', get: d.en });
  if (d.li) return act({ type: 'li', get: d.li });
  if (d.card) return act({ type: 'card', id: d.card });
  if (d.pn) { ui.setup.n = +d.pn; return renderModal(); }
  if (d.ptype) { readNames(); const [i, k] = d.ptype.split(':'); ui.setup.players[+i].bot = k === 'b'; return renderModal(); }
  if (d.tab) { ui.rulesTab = d.tab; return renderModal(); }
  if (d.tto) { ui.trade.to = +d.tto; ui.trade.get = {}; return renderModal(); }
  if (d.tr) {
    const [side, k, delta] = d.tr.split(':'), T = ui.trade;
    const src = side === 'give' ? st.players[st.current] : st.players[T.to];
    T[side][k] = Math.max(0, Math.min(src.res[k], (T[side][k] || 0) + +delta));
    return renderModal();
  }
  switch (d.a) {
    case 'roll': return act({ type: 'roll' });
    case 'end': return act({ type: 'end' });
    case 'cancel': ui.mode = null; return render();
    case 'bank': { const a = { type: 'bank', give: ui.bankGive, get: ui.bankGet }; ui.bankGive = ui.bankGet = null; return act(a); }
    case 'unify': return act({ type: 'unify' });
    case 'trade': ui.trade = { to: null, give: {}, get: {} }; return openModal('trade');
    case 'sendtrade': { const T = ui.trade; ui.modal = null; renderModal(); return act({ type: 'offer', to: T.to, give: T.give, get: T.get }); }
    case 'new': ui.setup = ui.setup || setupDefaults(); return openModal('new');
    case 'over': return openModal('over');
    case 'continue': { const g = loadSaved(); if (g) { st = g; ui.overShown = !!g.winner; ui.modal = null; renderModal(); render(); } return; }
    case 'start': {
      readNames();
      const s = ui.setup;
      const players = s.players.slice(0, s.n).map((p, i) => ({ name: (p.name || '').trim() || DEFAULT_NAMES[i], color: PCOL[i], bot: p.bot }));
      if (players.every(p => p.bot)) toast('Todos são computador: a partida vai rodar sozinha.');
      return startGame(players);
    }
    case 'close': case 'ovclose': ui.modal = null; return renderModal();
  }
}
function readNames() {
  if (!ui.setup) return;
  ui.setup.players.forEach((p, i) => { const el = document.getElementById(`p${i}name`); if (el) p.name = el.value; });
}
function boardPick(d) {
  if (!st || !humanTurn()) return;
  const v = d.v !== undefined ? +d.v : null, e = d.e !== undefined ? +d.e : null, h = d.h !== undefined ? +d.h : null;
  if (ui.mode && ui.mode.kind === 'place') return act({ type: 'build', kind: ui.mode.build, at: E.BUILD[ui.mode.build].tier === 3 ? e : v });
  const pd = st.pending;
  if (!pd) return;
  if (pd.pick === 'target') return act({ type: 'pick', value: v !== null ? { k: 'v', id: v } : { k: 'e', id: e } });
  return act({ type: 'pick', value: pd.pick === 'vertex' ? v : pd.pick === 'edge' ? e : h });
}
document.addEventListener('click', onClick);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (ui.modal) { ui.modal = null; renderModal(); } else if (ui.mode) { ui.mode = null; render(); }
});
document.addEventListener('input', ev => { if (ev.target.id && /^p\dname$/.test(ev.target.id)) readNames(); });
$('#bRules').addEventListener('click', () => openModal('rules'));
$('#bNew').addEventListener('click', () => { ui.setup = ui.setup || setupDefaults(); openModal('new'); });

function start(data) {
  renderLegend();
  if (data && data.st && data.st.board && !data.st.demo) { st = data.st; ui.overShown = !!st.winner; render(); return; }
  const saved = loadSaved();
  if (saved && !saved.winner) { st = saved; render(); return; }
  st = demoGame();
  ui.setup = setupDefaults();
  render();
  openModal('new');
}
window.claude?.hot?.snapshot?.(() => ({ st }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
</script>
